<!doctype html>
<html lang="en" data-surface="web-app">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="description" content="ChatChat — browser-first local AI consultation." />
    <title>ChatChat · AI Consultation</title>
    <script>
      const params = new URLSearchParams(location.search);
      if (!params.has("showcase")) {
        params.set("showcase", "consultation");
        params.set("lang", navigator.language?.toLowerCase().startsWith("zh") ? "zh" : "en");
        history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      }
    </script>
    <script src="/consultation-showcase-bootstrap.js"></script>
  </head>
  <body>
    <div id="extension-root"></div>
    <div id="consultation-theater-root"></div>
    <script type="module" src="/src/extension/consultation-theater-portal.tsx"></script>
    <script type="module" src="/src/extension/consultation-panel.tsx"></script>
  </body>
</html>
