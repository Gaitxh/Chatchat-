name: AI consultation compatibility
description: Report whether an AI website can participate in ChatChat's browser consultation flow.
title: "[AI Provider] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing an AI participant. Please remove account emails, cookies, tokens, private chats, private URLs and sensitive screenshots before submitting.

        ChatChat's primary browser experience treats AI sources as independent, equal participants. A successful test on one machine is environment-specific evidence, not a universal compatibility guarantee.

  - type: input
    id: provider
    attributes:
      label: AI Provider
      placeholder: Claude
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Public host
      description: Hostname only — no account/session path or query string.
      placeholder: claude.ai
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser / OS
      placeholder: Chrome 140 · macOS 15
    validations:
      required: true

  - type: dropdown
    id: permission
    attributes:
      label: Optional site permission
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: teach
    attributes:
      label: Teach Input / Send / Response
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection test
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Structured consultation protocol
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: consultation
    attributes:
      label: Real multi-AI consultation
      description: Tested together with at least one different AI source.
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Sanitized notes
      description: Describe the narrow failure stage. Do not paste private conversation content or credentials.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, cookies, tokens, private conversation content, account identifiers and account-specific URLs.
          required: true
        - label: I understand this report describes one environment and does not automatically make this Provider officially supported.
          required: true
