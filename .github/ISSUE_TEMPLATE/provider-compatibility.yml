name: Provider compatibility report
description: Report a real AI website run through ChatChat's current zero-config Browser Consultation pipeline.
title: "[Provider] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing a real Provider in ChatChat.

        Please remove account emails, cookies, tokens, private chats and sensitive screenshots before submitting anything publicly.

        Current evidence language is: **recognized → auto-detected → auto-connected → protocol-ready → Gate B candidate → runtime-validated → officially supported**.

        If you completed a fresh real Browser Consultation, the preferred evidence path is **Real Provider Proof → COPY GITHUB MARKDOWN**. Review the generated text before posting it.

  - type: input
    id: provider
    attributes:
      label: Provider
      description: Product/site name only.
      placeholder: Claude
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host
      description: Hostname only. Do not include account-specific paths or query strings.
      placeholder: claude.ai
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ChatChat version or commit
      placeholder: v0.9.0 / abc1234
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Browser / OS environment
      placeholder: Chrome 140 · Windows 11 / Chromium · macOS 15
    validations:
      required: true

  - type: input
    id: ui-date
    attributes:
      label: Provider UI date tested
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: textarea
    id: proof-pack
    attributes:
      label: Real Provider Proof (preferred)
      description: Paste COPY GITHUB MARKDOWN after reviewing it. The v1 proof intentionally excludes the user proposal, model replies, event text, page mappings/selectors and credentials.
      placeholder: |
        ## ChatChat Real Provider Proof
        **✅ Real Provider Gate B candidate evidence**
        ...
      render: markdown

  - type: dropdown
    id: recognized
    attributes:
      label: Provider recognized
      description: Did ChatChat identify the Provider host and product identity correctly?
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: permission
    attributes:
      label: Optional Provider-site permission
      description: Did ChatChat request only the Provider origin needed for this participant?
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: login
    attributes:
      label: Provider login / automatic resume
      description: If login was required, could you sign in on the Provider page and have ChatChat continue automatically without clicking Retry?
      options: [PASS, FAIL, NOT REQUIRED, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: autodetect
    attributes:
      label: Automatic page recognition
      description: Did ChatChat identify the conversation controls without manual Teach/selector setup?
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Automatic connection
      description: Did the participant complete the automatic connection handshake?
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: gate
    attributes:
      label: Consultation Protocol Gate
      description: Did the Provider return valid structured consultation output and become READY?
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: provider-host
    attributes:
      label: Provider origin healthy at consultation time
      description: Was the participant tab still on the expected Provider origin when the real consultation completed?
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: real-consultation
    attributes:
      label: Fresh real Browser Consultation with 2+ distinct Provider hosts
      description: Did sealed independent opinions, automatic consultation and final positions complete with another real Provider source?
      options: [PASS, FAIL, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: fallback
    attributes:
      label: Transport/parser fallback during the real run
      description: A Gate B candidate should not contain uncertainty fallbacks or zero-confidence final positions.
      options: [NONE, UNCERTAIN EVENT, ZERO-CONFIDENCE FINAL, OTHER, NOT TESTED]
    validations:
      required: true

  - type: dropdown
    id: advanced-repair
    attributes:
      label: Was Advanced repair needed?
      description: Manual Teach/selectors are a recovery fallback, not the normal zero-config path.
      options: [NO, YES, NOT TESTED]
    validations:
      required: true

  - type: textarea
    id: failure
    attributes:
      label: Failure stage / sanitized notes
      description: Include the narrowest failure stage and a sanitized error. Do not paste secrets or private chat content.
      placeholder: "Automatic page recognition stopped finding the send control after the Provider UI update..."

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and scope check
      options:
        - label: I reviewed the Real Provider Proof / report and removed passwords, cookies, tokens, account identifiers and private conversation content.
          required: true
        - label: I understand one successful machine/date is environment-specific evidence and does not automatically mean the Provider is officially supported.
          required: true
