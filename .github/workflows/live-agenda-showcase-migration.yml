name: Live Agenda Showcase Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Require fresh-signal Live Agenda in the production showcase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('extension-public/consultation-showcase-bootstrap.js')
          text = path.read_text()

          old = '''          if (liveFloor && workingSeats.length >= 2 && laneIds.size >= 3 && laneLabelsVisible) {\n            document.documentElement.dataset.chatchatLiveFloorShowcase = "complete";\n            document.documentElement.dataset.chatchatResearchLanesShowcase = "complete";\n          }\n'''
          new = '''          if (liveFloor && workingSeats.length >= 2 && laneIds.size >= 3 && laneLabelsVisible) {\n            document.documentElement.dataset.chatchatLiveFloorShowcase = "complete";\n            document.documentElement.dataset.chatchatResearchLanesShowcase = "complete";\n          }\n          const freshAgenda = document.querySelector('.live-agenda[data-phase-reason="fresh_signal_follow_up"]');\n          const agendaTriggers = freshAgenda?.querySelectorAll(".live-agenda__trigger") ?? [];\n          if (freshAgenda && agendaTriggers.length >= 1) {\n            document.documentElement.dataset.chatchatLiveAgendaShowcase = "complete";\n          }\n'''
          if text.count(old) != 1:
              raise SystemExit('live floor proof block changed')
          text = text.replace(old, new, 1)

          old = '''            document.querySelector(".consultation-theater") &&\n            researchRoster && replayLaneIds.size >= 3\n          ) {\n'''
          new = '''            document.querySelector(".consultation-theater") &&\n            researchRoster && replayLaneIds.size >= 3 &&\n            document.documentElement.dataset.chatchatLiveAgendaShowcase === "complete"\n          ) {\n'''
          if text.count(old) != 1:
              raise SystemExit('final showcase completion block changed')
          text = text.replace(old, new, 1)

          if 'chatchatLiveAgendaShowcase' not in text or 'fresh_signal_follow_up' not in text:
              raise SystemExit('Live Agenda showcase contract missing')
          path.write_text(text)
          PY

      - name: Commit source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension-public/consultation-showcase-bootstrap.js
          if git diff --cached --quiet; then
            echo "showcase already migrated"
          else
            git commit -m "Prove fresh-signal Live Agenda in Chromium"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
