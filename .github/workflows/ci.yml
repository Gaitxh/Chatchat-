name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Type check
        run: npm run check

      - name: Deterministic protocol and browser tests
        run: npm test

      - name: Build web demo
        run: npm run build:web

      - name: Build Browser Extension
        run: npm run build:extension

      - name: Upload unpacked Browser Extension
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-browser-extension-unpacked
          path: dist-extension/**
          if-no-files-found: error
          retention-days: 14

      - name: Install screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Start production previews
        run: |
          mkdir -p artifacts
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chatchat-preview.log 2>&1 &
          nohup python3 -m http.server 4180 --bind 127.0.0.1 --directory dist-extension > /tmp/chatchat-extension-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null && curl --fail --silent http://127.0.0.1:4180/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173 >/dev/null
          curl --fail http://127.0.0.1:4180/manifest.json >/dev/null

      - name: Capture built web Council Chamber
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chromium-compatible browser found on the runner."
            exit 1
          fi
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1900 \
            --screenshot=artifacts/chatchat-council-chamber.png \
            http://127.0.0.1:4173
          test -s artifacts/chatchat-council-chamber.png

      - name: Capture deterministic Council Theater showcase
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --window-size=1440,3400 \
            --screenshot=artifacts/chatchat-council-theater.png \
            'http://127.0.0.1:4173/?showcase=theater'
          test -s artifacts/chatchat-council-theater.png

      - name: Capture fresh Browser Extension 10-seat Congress showcase
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          EXTENSION_SHOWCASE='http://127.0.0.1:4180/extension/sidepanel.html?showcase=1'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --window-size=440,1650 \
            --screenshot=artifacts/chatchat-extension-sidepanel.png \
            "$EXTENSION_SHOWCASE"
          test -s artifacts/chatchat-extension-sidepanel.png

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --dump-dom \
            "$EXTENSION_SHOWCASE" > artifacts/chatchat-extension-sidepanel.html

          grep -q 'AI 民主代表大会' artifacts/chatchat-extension-sidepanel.html
          grep -q 'AI REPRESENTATIVE CONGRESS' artifacts/chatchat-extension-sidepanel.html
          grep -q '席位配额' artifacts/chatchat-extension-sidepanel.html
          grep -q 'HOUSE VERDICT' artifacts/chatchat-extension-sidepanel.html
          grep -q '×5' artifacts/chatchat-extension-sidepanel.html
          grep -q '6/10' artifacts/chatchat-extension-sidepanel.html
          grep -q '1/2' artifacts/chatchat-extension-sidepanel.html
          grep -q '5/5 ready' artifacts/chatchat-extension-sidepanel.html
          grep -q 'DETERMINISTIC 10-SEAT HOUSE SHOWCASE' artifacts/chatchat-extension-sidepanel.html
          ! grep -q "Cannot read properties of undefined" artifacts/chatchat-extension-sidepanel.html

      - name: Capture Summon the Congress showcase
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          SUMMON_SHOWCASE='http://127.0.0.1:4180/extension/sidepanel.html?showcase=summon'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=6000 \
            --window-size=440,1050 \
            --screenshot=artifacts/chatchat-extension-summon-house.png \
            "$SUMMON_SHOWCASE"
          test -s artifacts/chatchat-extension-summon-house.png

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=6000 \
            --dump-dom \
            "$SUMMON_SHOWCASE" > artifacts/chatchat-extension-summon-house.html
          test -s artifacts/chatchat-extension-summon-house.html

      - name: Upload Summon the Congress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-extension-summon-house
          path: |
            artifacts/chatchat-extension-summon-house.png
            artifacts/chatchat-extension-summon-house.html
          if-no-files-found: warn
          retention-days: 14

      - name: Assert Summon the Congress trust and default-quota boundary
        run: |
          grep -q 'id="chatchat-summon-house"' artifacts/chatchat-extension-summon-house.html
          grep -q 'data-summon-candidates="7"' artifacts/chatchat-extension-summon-house.html
          grep -q 'data-summon-default-quota="1"' artifacts/chatchat-extension-summon-house.html
          grep -q 'data-summon-reserve-tabs="0"' artifacts/chatchat-extension-summon-house.html
          grep -q 'data-summon-trust="unverified"' artifacts/chatchat-extension-summon-house.html
          grep -q 'data-summon-action="attach-only"' artifacts/chatchat-extension-summon-house.html
          grep -q 'data-chatchat-summon-showcase="booted"' artifacts/chatchat-extension-summon-house.html
          grep -q 'SUMMON THE CONGRESS' artifacts/chatchat-extension-summon-house.html
          grep -q '默认每代表团 1 席' artifacts/chatchat-extension-summon-house.html
          grep -q '更多席位可在代表团旁' artifacts/chatchat-extension-summon-house.html

      - name: Capture Community Recipe preview showcase
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          RECIPE_SHOWCASE='http://127.0.0.1:4180/extension/sidepanel.html?showcase=recipe'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=8000 \
            --window-size=620,1250 \
            --screenshot=artifacts/chatchat-extension-community-recipe.png \
            "$RECIPE_SHOWCASE"
          test -s artifacts/chatchat-extension-community-recipe.png

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=8000 \
            --dump-dom \
            "$RECIPE_SHOWCASE" > artifacts/chatchat-extension-community-recipe.html
          test -s artifacts/chatchat-extension-community-recipe.html

      - name: Upload Community Recipe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-extension-community-recipe
          path: |
            artifacts/chatchat-extension-community-recipe.png
            artifacts/chatchat-extension-community-recipe.html
          if-no-files-found: warn
          retention-days: 14

      - name: Assert Community Recipe trust boundary
        run: |
          grep -q 'data-chatchat-recipe-showcase="booted"' artifacts/chatchat-extension-community-recipe.html
          grep -q 'data-chatchat-recipe-preview="ready"' artifacts/chatchat-extension-community-recipe.html
          grep -q 'id="chatchat-recipe-share"' artifacts/chatchat-extension-community-recipe.html
          grep -q 'data-recipe-trust="map-only"' artifacts/chatchat-extension-community-recipe.html
          grep -q 'data-recipe-import-effect="test-required"' artifacts/chatchat-extension-community-recipe.html
          grep -q 'data-recipe-candidate-level="stable"' artifacts/chatchat-extension-community-recipe.html
          grep -q 'data-recipe-candidate-trust="test-required"' artifacts/chatchat-extension-community-recipe.html
          grep -q 'IMPORT · TEST REQUIRED' artifacts/chatchat-extension-community-recipe.html
          grep -q 'capturedAt' artifacts/chatchat-extension-community-recipe.html
          ! grep -q 'COUNCIL GATE ✓' artifacts/chatchat-extension-community-recipe.html

      - name: Upload web and Browser product screenshots
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-browser-product-showcase
          path: |
            artifacts/chatchat-council-chamber.png
            artifacts/chatchat-council-theater.png
            artifacts/chatchat-extension-sidepanel.png
            artifacts/chatchat-extension-sidepanel.html
          if-no-files-found: error
          retention-days: 14
