name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chatchat-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight · types / tests / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Deterministic protocol and consultation tests
        run: npm test

      - name: Build Browser Extension
        run: npm run build:extension

      - name: Upload unpacked Browser Extension
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-ai-consultation-extension
          path: dist-extension/**
          if-no-files-found: error
          retention-days: 14

  product-evidence:
    name: Product evidence · bilingual browser UI
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proof tooling
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download built Browser Extension
        uses: actions/download-artifact@v4
        with:
          name: chatchat-ai-consultation-extension
          path: dist-extension

      - name: Install CJK screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium browser
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start production extension preview
        run: |
          mkdir -p artifacts
          nohup python3 -m http.server 4180 --bind 127.0.0.1 --directory dist-extension > /tmp/chatchat-extension-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4180/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4180/manifest.json >/dev/null

      - name: Capture bilingual Side Panel proof from the ready DOM
        run: |
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url 'http://127.0.0.1:4180/extension/sidepanel.html?showcase=consultation&lang=zh' \
            --width 440 --height 3600 --wait-ms 18000 \
            --ready-selector 'html[data-chatchat-consultation-showcase="complete"][data-chatchat-history-persistence-showcase="complete"][data-chatchat-final-position-floor-showcase="complete"]' \
            --screenshot artifacts/chatchat-consultation-zh.png \
            --dom artifacts/chatchat-consultation-zh.html
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url 'http://127.0.0.1:4180/extension/sidepanel.html?showcase=consultation&lang=en' \
            --width 440 --height 3600 --wait-ms 18000 \
            --ready-selector 'html[data-chatchat-consultation-showcase="complete"][data-chatchat-history-persistence-showcase="complete"][data-chatchat-final-position-floor-showcase="complete"]' \
            --screenshot artifacts/chatchat-consultation-en.png \
            --dom artifacts/chatchat-consultation-en.html

      - name: Capture bilingual Full Room proof from the ready DOM
        run: |
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url 'http://127.0.0.1:4180/app/app.html?showcase=consultation&lang=zh' \
            --width 1440 --height 2800 --wait-ms 22000 \
            --ready-selector 'html[data-chatchat-room-showcase="complete"][data-chatchat-history-persistence-showcase="complete"][data-chatchat-final-position-floor-showcase="complete"]' \
            --screenshot artifacts/chatchat-room-zh.png \
            --dom artifacts/chatchat-room-zh.html
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url 'http://127.0.0.1:4180/app/app.html?showcase=consultation&lang=en' \
            --width 1440 --height 2800 --wait-ms 22000 \
            --ready-selector 'html[data-chatchat-room-showcase="complete"][data-chatchat-history-persistence-showcase="complete"][data-chatchat-final-position-floor-showcase="complete"]' \
            --screenshot artifacts/chatchat-room-en.png \
            --dom artifacts/chatchat-room-en.html

      - name: Capture bilingual Final Position Floor close-up
        run: |
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url 'http://127.0.0.1:4180/app/app.html?showcase=consultation&lang=zh' \
            --width 1440 --height 1800 --wait-ms 22000 \
            --ready-selector 'html[data-chatchat-final-position-floor-showcase="complete"]' \
            --focus-selector '[data-final-position-floor="explicit-final-submissions"]' \
            --screenshot artifacts/chatchat-final-position-floor-zh.png \
            --dom artifacts/chatchat-final-position-floor-zh.html
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url 'http://127.0.0.1:4180/app/app.html?showcase=consultation&lang=en' \
            --width 1440 --height 1800 --wait-ms 22000 \
            --ready-selector 'html[data-chatchat-final-position-floor-showcase="complete"]' \
            --focus-selector '[data-final-position-floor="explicit-final-submissions"]' \
            --screenshot artifacts/chatchat-final-position-floor-en.png \
            --dom artifacts/chatchat-final-position-floor-en.html

      - name: Capture bilingual live persuasion frame from the proved DOM
        run: |
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url 'http://127.0.0.1:4180/app/app.html?showcase=consultation&lang=zh&live-proof=persuasion' \
            --width 1440 --height 2200 --wait-ms 22000 \
            --ready-selector '.chatchat-live-proof-frame[data-chatchat-live-proof-frame="persuasion"]' \
            --screenshot artifacts/chatchat-live-meeting-zh.png \
            --dom artifacts/chatchat-live-meeting-zh.html
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url 'http://127.0.0.1:4180/app/app.html?showcase=consultation&lang=en&live-proof=persuasion' \
            --width 1440 --height 2200 --wait-ms 22000 \
            --ready-selector '.chatchat-live-proof-frame[data-chatchat-live-proof-frame="persuasion"]' \
            --screenshot artifacts/chatchat-live-meeting-en.png \
            --dom artifacts/chatchat-live-meeting-en.html

      - name: Reject blank or visually empty screenshots
        run: |
          node scripts/check-png-content.mjs \
            artifacts/chatchat-consultation-zh.png \
            artifacts/chatchat-consultation-en.png \
            artifacts/chatchat-room-zh.png \
            artifacts/chatchat-room-en.png \
            artifacts/chatchat-final-position-floor-zh.png \
            artifacts/chatchat-final-position-floor-en.png \
            artifacts/chatchat-live-meeting-zh.png \
            artifacts/chatchat-live-meeting-en.png

      - name: Validate bilingual product evidence semantics
        run: |
          node scripts/validate-product-evidence.mjs artifacts dist-extension/manifest.json
          node scripts/validate-final-position-evidence.mjs artifacts

      - name: Save preview log
        if: always()
        run: cp /tmp/chatchat-extension-preview.log artifacts/preview.log 2>/dev/null || true

      - name: Upload bilingual product evidence / debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-ai-consultation-showcase
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
