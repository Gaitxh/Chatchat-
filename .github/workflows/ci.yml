name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-consultation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Type check
        run: npm run check

      - name: Deterministic protocol and consultation tests
        run: npm test

      - name: Build Browser Extension
        run: npm run build:extension

      - name: Upload unpacked Browser Extension
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-ai-consultation-extension
          path: dist-extension/**
          if-no-files-found: error
          retention-days: 14

      - name: Install CJK screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Start production extension preview
        run: |
          mkdir -p artifacts
          nohup python3 -m http.server 4180 --bind 127.0.0.1 --directory dist-extension > /tmp/chatchat-extension-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4180/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4180/manifest.json >/dev/null

      - name: Capture Chinese consultation product
        run: |
          set -euo pipefail
          assert_dom() {
            local pattern="$1"
            local label="$2"
            if grep -q "$pattern" artifacts/chatchat-consultation-zh.html; then
              echo "✓ $label"
            else
              echo "✗ MISSING: $label :: $pattern"
              exit 1
            fi
          }
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          URL='http://127.0.0.1:4180/extension/sidepanel.html?showcase=consultation&lang=zh'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --window-size=440,4300 \
            --screenshot=artifacts/chatchat-consultation-zh.png \
            "$URL"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --dump-dom \
            "$URL" > artifacts/chatchat-consultation-zh.html
          test -s artifacts/chatchat-consultation-zh.png
          assert_dom 'data-chatchat-consultation-showcase="complete"' 'showcase completed'
          assert_dom '用户发起提案' 'proposal UI'
          assert_dom '平等 AI 参与者' 'equal participants'
          assert_dom '没有议长' 'no-chair principle'
          assert_dom '协商结果' 'consultation outcome'
          assert_dom '协商剧场' 'Consultation Theater'
          assert_dom '明确发生的立场修正' 'changed-mind trail'
          assert_dom '协商记录' 'Consultation History heading'
          assert_dom '只属于你的本地协商记忆' 'Consultation History body'
          assert_dom 'INDEXEDDB · 本地' 'local IndexedDB badge'
          assert_dom 'class="history-entry' 'saved history entry'
          assert_dom '对于一个开源、本地优先的多 AI 浏览器项目' 'saved proposal preview'
          assert_dom 'Claude' 'Claude participant'
          assert_dom 'Web + Extension' 'old stance'
          assert_dom 'Browser Extension' 'new stance'

      - name: Upload Chinese showcase debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-consultation-zh-debug
          path: |
            artifacts/chatchat-consultation-zh.png
            artifacts/chatchat-consultation-zh.html
          if-no-files-found: warn
          retention-days: 3

      - name: Capture English consultation product
        run: |
          set -euo pipefail
          assert_dom() {
            local pattern="$1"
            local label="$2"
            if grep -q "$pattern" artifacts/chatchat-consultation-en.html; then
              echo "✓ $label"
            else
              echo "✗ MISSING: $label :: $pattern"
              exit 1
            fi
          }
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          URL='http://127.0.0.1:4180/extension/sidepanel.html?showcase=consultation&lang=en'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --window-size=440,4300 \
            --screenshot=artifacts/chatchat-consultation-en.png \
            "$URL"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --dump-dom \
            "$URL" > artifacts/chatchat-consultation-en.html
          test -s artifacts/chatchat-consultation-en.png
          assert_dom 'data-chatchat-consultation-showcase="complete"' 'showcase completed'
          assert_dom 'Propose once' 'proposal UI'
          assert_dom 'Equal AI participants' 'equal participants'
          assert_dom 'no chair' 'no-chair principle'
          assert_dom 'CONSULTATION OUTCOME' 'consultation outcome'
          assert_dom 'CONSULTATION THEATER' 'Consultation Theater'
          assert_dom 'Explicit revisions' 'changed-mind trail'
          assert_dom 'CONSULTATION HISTORY' 'Consultation History heading'
          assert_dom 'Your local consultation memory' 'Consultation History body'
          assert_dom 'INDEXEDDB · LOCAL' 'local IndexedDB badge'
          assert_dom 'class="history-entry' 'saved history entry'
          assert_dom 'For an open-source, local-first multi-AI browser project' 'saved proposal preview'
          assert_dom 'Who changed what' 'Theater copy'
          assert_dom 'Claude' 'Claude participant'
          assert_dom 'Web + Extension' 'old stance'
          assert_dom 'Browser Extension' 'new stance'

      - name: Enforce equal-consultation product language
        run: |
          for page in artifacts/chatchat-consultation-zh.html artifacts/chatchat-consultation-en.html; do
            ! grep -q "KING'S COMMAND" "$page"
            ! grep -q 'AI HOUSE' "$page"
            ! grep -q 'HOUSE VERDICT' "$page"
            ! grep -qi 'Delegation' "$page"
            ! grep -q '众议院' "$page"
            ! grep -q 'COUNCIL THEATER' "$page"
            ! grep -q '议会剧场' "$page"
            ! grep -q 'COURT CHRONICLE' "$page"
          done

      - name: Validate extension manifest product identity
        run: |
          grep -q 'ChatChat — AI Consultation' dist-extension/manifest.json
          grep -q 'optional_host_permissions' dist-extension/manifest.json
          ! grep -q 'AI Council' dist-extension/manifest.json
          ! grep -q 'Parliament' dist-extension/manifest.json

      - name: Upload bilingual product evidence
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-ai-consultation-showcase
          path: |
            artifacts/chatchat-consultation-zh.png
            artifacts/chatchat-consultation-en.png
            artifacts/chatchat-consultation-zh.html
            artifacts/chatchat-consultation-en.html
          if-no-files-found: error
          retention-days: 14
