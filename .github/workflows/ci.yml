name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  council-core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Type check
        run: npm run check

      - name: Core tests
        run: npm test

      - name: Build Council Chamber
        run: npm run build:web
