name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  council-core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Type check
        run: npm run check

      - name: Core tests
        run: npm test

      - name: Build Council Chamber
        run: npm run build:web

      - name: Build Browser Extension
        run: npm run build:extension

      - name: Upload unpacked Browser Extension
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-browser-extension-unpacked
          path: dist-extension/**
          if-no-files-found: error
          retention-days: 14

      - name: Install screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Start production previews
        run: |
          mkdir -p artifacts
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chatchat-preview.log 2>&1 &
          nohup python3 -m http.server 4180 --bind 127.0.0.1 --directory dist-extension > /tmp/chatchat-extension-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null && curl --fail --silent http://127.0.0.1:4180/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173 >/dev/null
          curl --fail http://127.0.0.1:4180/manifest.json >/dev/null

      - name: Capture built Council Chamber
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chromium-compatible browser found on the runner."
            exit 1
          fi
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1900 \
            --screenshot=artifacts/chatchat-council-chamber.png \
            http://127.0.0.1:4173
          test -s artifacts/chatchat-council-chamber.png

      - name: Capture deterministic Council Theater showcase
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --window-size=1440,3400 \
            --screenshot=artifacts/chatchat-council-theater.png \
            'http://127.0.0.1:4173/?showcase=theater'
          test -s artifacts/chatchat-council-theater.png

      - name: Capture fresh Browser Extension 10-seat House showcase
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          EXTENSION_SHOWCASE='http://127.0.0.1:4180/extension/sidepanel.html?showcase=1'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --window-size=440,1650 \
            --screenshot=artifacts/chatchat-extension-sidepanel.png \
            "$EXTENSION_SHOWCASE"
          test -s artifacts/chatchat-extension-sidepanel.png

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=24000 \
            --dump-dom \
            "$EXTENSION_SHOWCASE" > artifacts/chatchat-extension-sidepanel.html

          grep -q 'HOUSE VERDICT' artifacts/chatchat-extension-sidepanel.html
          grep -q '×5' artifacts/chatchat-extension-sidepanel.html
          grep -q '6/10' artifacts/chatchat-extension-sidepanel.html
          grep -q '1/2' artifacts/chatchat-extension-sidepanel.html
          grep -q '5/5 ready' artifacts/chatchat-extension-sidepanel.html
          grep -q 'DETERMINISTIC 10-SEAT HOUSE SHOWCASE' artifacts/chatchat-extension-sidepanel.html
          ! grep -q "Cannot read properties of undefined" artifacts/chatchat-extension-sidepanel.html

      - name: Capture Summon the House showcase
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          SUMMON_SHOWCASE='http://127.0.0.1:4180/extension/sidepanel.html?showcase=summon'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=6000 \
            --window-size=440,1050 \
            --screenshot=artifacts/chatchat-extension-summon-house.png \
            "$SUMMON_SHOWCASE"
          test -s artifacts/chatchat-extension-summon-house.png

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=6000 \
            --dump-dom \
            "$SUMMON_SHOWCASE" > artifacts/chatchat-extension-summon-house.html

          grep -q 'id="chatchat-summon-house"' artifacts/chatchat-extension-summon-house.html
          grep -q 'data-summon-candidates="7"' artifacts/chatchat-extension-summon-house.html
          grep -q 'data-chatchat-summon-showcase="booted"' artifacts/chatchat-extension-summon-house.html
          grep -q 'SUMMON THE HOUSE' artifacts/chatchat-extension-summon-house.html
          grep -q '新席位仍需 Test + Gate' artifacts/chatchat-extension-summon-house.html
          ! grep -q 'COUNCIL GATE ✓' artifacts/chatchat-extension-summon-house.html

      - name: Upload Council Chamber screenshot
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-council-chamber
          path: artifacts/chatchat-council-chamber.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Council Theater screenshot
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-council-theater
          path: artifacts/chatchat-council-theater.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Browser Extension screenshot
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-extension-sidepanel
          path: |
            artifacts/chatchat-extension-sidepanel.png
            artifacts/chatchat-extension-sidepanel.html
          if-no-files-found: error
          retention-days: 14

      - name: Upload Summon the House screenshot
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-extension-summon-house
          path: |
            artifacts/chatchat-extension-summon-house.png
            artifacts/chatchat-extension-summon-house.html
          if-no-files-found: error
          retention-days: 14

  desktop-shell:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
