name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chatchat-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight · types / tests / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Type check
        run: npm run check

      - name: Deterministic protocol and consultation tests
        run: npm test

      - name: Build Browser Extension
        run: npm run build:extension

      - name: Upload unpacked Browser Extension
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-ai-consultation-extension
          path: dist-extension/**
          if-no-files-found: error
          retention-days: 14

  product-evidence:
    name: Product evidence · bilingual browser UI
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download built Browser Extension
        uses: actions/download-artifact@v4
        with:
          name: chatchat-ai-consultation-extension
          path: dist-extension

      - name: Install CJK screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium browser
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start production extension preview
        run: |
          mkdir -p artifacts
          nohup python3 -m http.server 4180 --bind 127.0.0.1 --directory dist-extension > /tmp/chatchat-extension-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4180/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4180/manifest.json >/dev/null

      - name: Capture Chinese consultation product
        run: |
          URL='http://127.0.0.1:4180/extension/sidepanel.html?showcase=consultation&lang=zh'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=18000 \
            --window-size=440,3600 \
            --screenshot=artifacts/chatchat-consultation-zh.png \
            "$URL"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=18000 \
            --dump-dom \
            "$URL" > artifacts/chatchat-consultation-zh.html
          test -s artifacts/chatchat-consultation-zh.png
          grep -q 'data-chatchat-consultation-showcase="complete"' artifacts/chatchat-consultation-zh.html
          grep -q 'data-chatchat-evidence-radar-showcase="complete"' artifacts/chatchat-consultation-zh.html
          grep -q 'data-chatchat-next-move-showcase="complete"' artifacts/chatchat-consultation-zh.html
          grep -q 'data-chatchat-proposal-mode-showcase="complete"' artifacts/chatchat-consultation-zh.html
          grep -q 'data-chatchat-consultation-receipt-showcase="complete"' artifacts/chatchat-consultation-zh.html
          grep -q 'data-chatchat-investigation-trail-showcase="complete"' artifacts/chatchat-consultation-zh.html
          grep -q '用户发起提案' artifacts/chatchat-consultation-zh.html
          grep -q '平等 AI 参与者' artifacts/chatchat-consultation-zh.html
          grep -q '没有议长' artifacts/chatchat-consultation-zh.html
          grep -q '协商结果' artifacts/chatchat-consultation-zh.html
          grep -q '协商剧场' artifacts/chatchat-consultation-zh.html
          grep -q '明确发生的立场修正' artifacts/chatchat-consultation-zh.html
          grep -q 'Claude' artifacts/chatchat-consultation-zh.html
          grep -q 'Web + Extension' artifacts/chatchat-consultation-zh.html
          grep -q 'Browser Extension' artifacts/chatchat-consultation-zh.html

      - name: Capture English consultation product
        run: |
          URL='http://127.0.0.1:4180/extension/sidepanel.html?showcase=consultation&lang=en'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=18000 \
            --window-size=440,3600 \
            --screenshot=artifacts/chatchat-consultation-en.png \
            "$URL"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=18000 \
            --dump-dom \
            "$URL" > artifacts/chatchat-consultation-en.html
          test -s artifacts/chatchat-consultation-en.png
          grep -q 'data-chatchat-consultation-showcase="complete"' artifacts/chatchat-consultation-en.html
          grep -q 'data-chatchat-evidence-radar-showcase="complete"' artifacts/chatchat-consultation-en.html
          grep -q 'data-chatchat-next-move-showcase="complete"' artifacts/chatchat-consultation-en.html
          grep -q 'data-chatchat-proposal-mode-showcase="complete"' artifacts/chatchat-consultation-en.html
          grep -q 'data-chatchat-consultation-receipt-showcase="complete"' artifacts/chatchat-consultation-en.html
          grep -q 'data-chatchat-investigation-trail-showcase="complete"' artifacts/chatchat-consultation-en.html
          grep -q 'Propose once' artifacts/chatchat-consultation-en.html
          grep -q 'Equal AI participants' artifacts/chatchat-consultation-en.html
          grep -qi 'no chair' artifacts/chatchat-consultation-en.html
          grep -q 'CONSULTATION OUTCOME' artifacts/chatchat-consultation-en.html
          grep -q 'CONSULTATION THEATER' artifacts/chatchat-consultation-en.html
          grep -q 'Explicit revisions' artifacts/chatchat-consultation-en.html
          grep -q 'Who changed what' artifacts/chatchat-consultation-en.html
          grep -q 'Claude' artifacts/chatchat-consultation-en.html
          grep -q 'Web + Extension' artifacts/chatchat-consultation-en.html
          grep -q 'Browser Extension' artifacts/chatchat-consultation-en.html

      - name: Capture Chinese Full Room product
        run: |
          URL='http://127.0.0.1:4180/app/app.html?showcase=consultation&lang=zh'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=22000 \
            --window-size=1440,2800 \
            --screenshot=artifacts/chatchat-room-zh.png \
            "$URL"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=22000 \
            --dump-dom \
            "$URL" > artifacts/chatchat-room-zh.html
          test -s artifacts/chatchat-room-zh.png
          grep -q 'data-chatchat-room-showcase="complete"' artifacts/chatchat-room-zh.html
          grep -q 'data-chatchat-evidence-radar-showcase="complete"' artifacts/chatchat-room-zh.html
          grep -q 'data-chatchat-next-move-showcase="complete"' artifacts/chatchat-room-zh.html
          grep -q 'data-chatchat-proposal-mode-showcase="complete"' artifacts/chatchat-room-zh.html
          grep -q 'data-chatchat-consultation-receipt-showcase="complete"' artifacts/chatchat-room-zh.html
          grep -q 'data-chatchat-investigation-trail-showcase="complete"' artifacts/chatchat-room-zh.html
          grep -q '协商记录' artifacts/chatchat-room-zh.html
          grep -q 'history-entry' artifacts/chatchat-room-zh.html
          grep -q 'INDEXEDDB · LOCAL' artifacts/chatchat-room-zh.html
          grep -q '协商剧场' artifacts/chatchat-room-zh.html
          grep -q 'AI 关系战场' artifacts/chatchat-room-zh.html

      - name: Capture English Full Room product
        run: |
          URL='http://127.0.0.1:4180/app/app.html?showcase=consultation&lang=en'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=22000 \
            --window-size=1440,2800 \
            --screenshot=artifacts/chatchat-room-en.png \
            "$URL"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=22000 \
            --dump-dom \
            "$URL" > artifacts/chatchat-room-en.html
          test -s artifacts/chatchat-room-en.png
          grep -q 'data-chatchat-room-showcase="complete"' artifacts/chatchat-room-en.html
          grep -q 'data-chatchat-evidence-radar-showcase="complete"' artifacts/chatchat-room-en.html
          grep -q 'data-chatchat-next-move-showcase="complete"' artifacts/chatchat-room-en.html
          grep -q 'data-chatchat-proposal-mode-showcase="complete"' artifacts/chatchat-room-en.html
          grep -q 'data-chatchat-consultation-receipt-showcase="complete"' artifacts/chatchat-room-en.html
          grep -q 'data-chatchat-investigation-trail-showcase="complete"' artifacts/chatchat-room-en.html
          grep -q 'CONSULTATION HISTORY' artifacts/chatchat-room-en.html
          grep -q 'history-entry' artifacts/chatchat-room-en.html
          grep -q 'INDEXEDDB · LOCAL' artifacts/chatchat-room-en.html
          grep -q 'CONSULTATION THEATER' artifacts/chatchat-room-en.html
          grep -q 'RELATIONSHIP MAP' artifacts/chatchat-room-en.html

      - name: Enforce equal-consultation product language
        run: |
          for page in artifacts/chatchat-consultation-zh.html artifacts/chatchat-consultation-en.html artifacts/chatchat-room-zh.html artifacts/chatchat-room-en.html; do
            ! grep -q "KING'S COMMAND" "$page"
            ! grep -q 'AI HOUSE' "$page"
            ! grep -q 'HOUSE VERDICT' "$page"
            ! grep -qi 'Delegation' "$page"
            ! grep -q '众议院' "$page"
            ! grep -q 'COUNCIL THEATER' "$page"
            ! grep -q '议会剧场' "$page"
          done

      - name: Validate extension manifest product identity
        run: |
          grep -q 'ChatChat — AI Consultation' dist-extension/manifest.json
          grep -q 'optional_host_permissions' dist-extension/manifest.json
          test -s dist-extension/app/app.html
          ! grep -q 'AI Council' dist-extension/manifest.json
          ! grep -q 'Parliament' dist-extension/manifest.json

      - name: Save preview log
        if: always()
        run: cp /tmp/chatchat-extension-preview.log artifacts/preview.log 2>/dev/null || true

      - name: Upload bilingual product evidence / debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-ai-consultation-showcase
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
