name: Zero-config UI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chatchat-zero-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zero-config-full-room:
    name: Zero-config · fresh Full Room
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build production extension
        run: |
          npm ci
          npm run build:extension

      - name: Protect existing AI conversations
        run: |
          # Source-of-truth moved to explicit fresh-seat planning. Check actual
          # bound launch origins and the only function that creates owned tabs.
          grep -q 'automaticTeamLaunchUrl' src/extension/automatic-team.ts
          grep -q 'createFreshSeat' src/extension/web-room-onboarding.tsx
          grep -q 'createdByChatChat: true' src/extension/fresh-seat.ts
          grep -q 'never sends' src/extension/automatic-team.ts
          ! grep -q 'findReusableAutomaticTeamTab' src/extension/web-room-onboarding.tsx
          ! grep -q 'findReusableAutomaticTeamTab' src/extension/automatic-team.ts

      - name: Enforce live zero-config transition
        run: |
          grep -q 'announceAutomaticTeamAssembled' src/extension/web-room-onboarding.tsx
          grep -q 'AUTOMATIC_TEAM_ASSEMBLED_EVENT' src/extension/consultation-panel.tsx
          ! grep -q 'location.reload' src/extension/web-room-onboarding.tsx
          ! grep -q 'window.location.reload' src/extension/web-room-onboarding.tsx

      - name: Install CJK screenshot fonts
        timeout-minutes: 4
        run: bash scripts/install-ci-cjk-fonts.sh

      - name: Locate Chromium browser
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start production preview
        run: |
          mkdir -p artifacts
          nohup python3 -m http.server 4181 --bind 127.0.0.1 --directory dist-extension > /tmp/chatchat-zero-config-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4181/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4181/manifest.json >/dev/null

      - name: Capture fresh English Full Room
        run: |
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url "http://127.0.0.1:4181/app/app.html?showcase=zero-config&lang=en" \
            --width 1440 --height 1800 --wait-ms 22000 \
            --ready-selector 'html[data-chatchat-zero-config-showcase="complete"][data-chatchat-zero-config-no-auto-create="complete"][data-chatchat-zero-config-manual-invite="visible"]' \
            --screenshot "artifacts/chatchat-zero-config-en.png" \
            --dom "artifacts/chatchat-zero-config-en.html"
          test -s artifacts/chatchat-zero-config-en.png
          grep -q 'data-chatchat-zero-config-no-auto-create="complete"' artifacts/chatchat-zero-config-en.html
          grep -q 'data-chatchat-zero-config-manual-invite="visible"' artifacts/chatchat-zero-config-en.html
          grep -q 'data-chatchat-zero-config-showcase="complete"' artifacts/chatchat-zero-config-en.html
          grep -q 'CHOOSE YOUR AI TEAM' artifacts/chatchat-zero-config-en.html
          grep -q 'Optional starter team: ChatGPT · Claude · Gemini' artifacts/chatchat-zero-config-en.html
          grep -q 'Use suggested starter team' artifacts/chatchat-zero-config-en.html
          grep -q 'Existing AI tabs only inform suggestions; they never receive setup messages.' artifacts/chatchat-zero-config-en.html
          grep -q 'New-chat entries and connection checks cannot prove a provider created a fresh conversation.' artifacts/chatchat-zero-config-en.html
          ! grep -q 'Start automatic setup' artifacts/chatchat-zero-config-en.html

      - name: Capture fresh Chinese Full Room
        run: |
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url "http://127.0.0.1:4181/app/app.html?showcase=zero-config&lang=zh" \
            --width 1440 --height 1800 --wait-ms 22000 \
            --ready-selector 'html[data-chatchat-zero-config-showcase="complete"][data-chatchat-zero-config-no-auto-create="complete"][data-chatchat-zero-config-manual-invite="visible"]' \
            --screenshot "artifacts/chatchat-zero-config-zh.png" \
            --dom "artifacts/chatchat-zero-config-zh.html"
          test -s artifacts/chatchat-zero-config-zh.png
          grep -q 'data-chatchat-zero-config-no-auto-create="complete"' artifacts/chatchat-zero-config-zh.html
          grep -q 'data-chatchat-zero-config-manual-invite="visible"' artifacts/chatchat-zero-config-zh.html
          grep -q 'data-chatchat-zero-config-showcase="complete"' artifacts/chatchat-zero-config-zh.html
          grep -q '自选 AI 团队' artifacts/chatchat-zero-config-zh.html
          grep -q '可选起步团队：ChatGPT' artifacts/chatchat-zero-config-zh.html
          grep -q '使用建议的起步团队' artifacts/chatchat-zero-config-zh.html
          grep -q '已有 AI 标签页仅用于建议' artifacts/chatchat-zero-config-zh.html
          grep -q '打开新对话入口和通过连接检查不能证明网站已创建全新对话' artifacts/chatchat-zero-config-zh.html
          ! grep -q '开始自动配置' artifacts/chatchat-zero-config-zh.html

      - name: Prove English room assembles live without reload
        run: |
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url "http://127.0.0.1:4181/app/app.html?showcase=zero-config&journey=assemble&lang=en" \
            --width 1440 --height 2200 --wait-ms 35000 \
            --ready-selector 'html[data-chatchat-zero-config-assembly="complete"][data-chatchat-zero-config-draft-preserved="complete"]' \
            --screenshot "artifacts/chatchat-zero-config-assembled-en.png" \
            --dom "artifacts/chatchat-zero-config-assembled-en.html"
          test -s artifacts/chatchat-zero-config-assembled-en.png
          grep -q 'data-chatchat-zero-config-assembly="complete"' artifacts/chatchat-zero-config-assembled-en.html
          grep -q 'data-chatchat-zero-config-draft-preserved="complete"' artifacts/chatchat-zero-config-assembled-en.html
          grep -q 'data-chatchat-zero-config-legacy-guide="suppressed"' artifacts/chatchat-zero-config-assembled-en.html
          grep -q 'data-chatchat-zero-config-full-room-restored="complete"' artifacts/chatchat-zero-config-assembled-en.html
          grep -q 'participant-row connection-ready is-ready' artifacts/chatchat-zero-config-assembled-en.html
          grep -q 'This user draft must survive automatic room assembly unchanged.' artifacts/chatchat-zero-config-assembled-en.html

      - name: Prove Chinese room assembles live without reload
        run: |
          node scripts/capture-chromium-proof.mjs \
            --chrome "$CHROME_BIN" \
            --url "http://127.0.0.1:4181/app/app.html?showcase=zero-config&journey=assemble&lang=zh" \
            --width 1440 --height 2200 --wait-ms 35000 \
            --ready-selector 'html[data-chatchat-zero-config-assembly="complete"][data-chatchat-zero-config-draft-preserved="complete"]' \
            --screenshot "artifacts/chatchat-zero-config-assembled-zh.png" \
            --dom "artifacts/chatchat-zero-config-assembled-zh.html"
          test -s artifacts/chatchat-zero-config-assembled-zh.png
          grep -q 'data-chatchat-zero-config-assembly="complete"' artifacts/chatchat-zero-config-assembled-zh.html
          grep -q 'data-chatchat-zero-config-draft-preserved="complete"' artifacts/chatchat-zero-config-assembled-zh.html
          grep -q 'data-chatchat-zero-config-legacy-guide="suppressed"' artifacts/chatchat-zero-config-assembled-zh.html
          grep -q 'data-chatchat-zero-config-full-room-restored="complete"' artifacts/chatchat-zero-config-assembled-zh.html
          grep -q 'participant-row connection-ready is-ready' artifacts/chatchat-zero-config-assembled-zh.html
          grep -q '这段用户草稿必须在会议室自动组建后原样保留。' artifacts/chatchat-zero-config-assembled-zh.html

      - name: Save preview log
        if: always()
        run: cp /tmp/chatchat-zero-config-preview.log artifacts/preview.log 2>/dev/null || true

      - name: Upload zero-config browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-zero-config-ui
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
