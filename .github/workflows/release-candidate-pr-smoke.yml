name: Release Candidate PR Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  desktop-bundles:
    name: ${{ matrix.platform }} candidate
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: npm install

      - name: Gate A — types and deterministic tests
        run: |
          npm run check
          npm test

      - name: Generate platform icons
        run: npm run tauri -- icon --output src-tauri/icons assets/chatchat-app-icon.svg

      - name: Verify generated bundle icons
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; const paths=['src-tauri/icons/32x32.png','src-tauri/icons/128x128.png','src-tauri/icons/128x128@2x.png','src-tauri/icons/icon.png','src-tauri/icons/icon.icns','src-tauri/icons/icon.ico']; for (const p of paths) { if (!fs.existsSync(p)) throw new Error('Missing generated release icon: '+p); } console.log('Verified release icons:', paths.join(', '));"

      - name: Build unsigned candidate
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.release.conf.json

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-${{ matrix.platform }}-candidate-smoke
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 3
