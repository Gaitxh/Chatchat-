name: Web Room Showcase

on:
  pull_request:
  push:
    branches: [main]

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:extension
      - name: Start local product preview
        run: |
          mkdir -p artifacts
          nohup python3 -m http.server 4181 --bind 127.0.0.1 --directory dist-extension >/tmp/chatchat-web-room.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4181/app/app.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4181/app/app.html >/dev/null
      - name: Capture full-page Web Room
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for LANG in en zh; do
            URL="http://127.0.0.1:4181/app/app.html?showcase=consultation&lang=${LANG}"
            "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=1440,3600 --screenshot="artifacts/web-room-${LANG}.png" "$URL"
            "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --dump-dom "$URL" > "artifacts/web-room-${LANG}.html"
          done
          test -s artifacts/web-room-en.png
          test -s artifacts/web-room-zh.png
          grep -q 'data-chatchat-consultation-showcase="complete"' artifacts/web-room-en.html
          grep -q 'The meeting has a plot now' artifacts/web-room-en.html
          grep -q 'Who is pushing whom' artifacts/web-room-en.html
          grep -q 'CONSULTATION OUTCOME' artifacts/web-room-en.html
          grep -q '这场会议开始有剧情了' artifacts/web-room-zh.html
          grep -q '谁正在影响谁' artifacts/web-room-zh.html
          grep -q '协商结果' artifacts/web-room-zh.html
      - uses: actions/upload-artifact@v4
        with:
          name: chatchat-full-page-web-room-showcase
          path: artifacts/web-room-*
          if-no-files-found: error
          retention-days: 14
