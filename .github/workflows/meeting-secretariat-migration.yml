name: Meeting Secretariat Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Wire Live Agenda and Open Issues into current product surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          floor = Path('src/extension/components/LiveParticipantFloor.tsx')
          text = floor.read_text()
          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import type { Locale } from "../../i18n/index.js";\nimport "./live-participant-floor.css";\n',
              'import type { Locale } from "../../i18n/index.js";\nimport { LiveAgenda } from "./LiveAgenda.js";\nimport { OpenIssuesRadar } from "./OpenIssuesRadar.js";\nimport "./live-participant-floor.css";\n',
              'live floor imports',
          )
          replace_once(
              '      <RoundRail phase={phase} events={events} counts={roundCounts} locale={locale} />\n',
              '      <LiveAgenda phase={phase} events={events} participants={participants} locale={locale} />\n      <OpenIssuesRadar participants={participants} events={events} locale={locale} />\n      <RoundRail phase={phase} events={events} counts={roundCounts} locale={locale} />\n',
              'live floor secretariat placement',
          )
          floor.write_text(text)

          portal = Path('src/extension/consultation-theater-portal.tsx')
          text = portal.read_text()
          def portal_replace(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          portal_replace(
              'import { LiveParticipantFloor } from "./components/LiveParticipantFloor.js";\n',
              'import { LiveParticipantFloor } from "./components/LiveParticipantFloor.js";\nimport { OpenIssuesRadar } from "./components/OpenIssuesRadar.js";\n',
              'portal import',
          )
          portal_replace(
              '''      {archiveMode ? (\n        <div className="consultation-archive-banner">''',
              '''      {archiveMode ? (\n        <div className="consultation-archive-banner">''',
              'archive banner anchor',
          )
          needle = '''      <ConsultationTheater\n        participants={participants}\n        events={completion.events}\n        report={completion.report}\n        locale={locale}\n        selectedEventId={selectedEventId}\n        onSelectEvent={setSelectedEventId}\n      />'''
          replacement = '''      <OpenIssuesRadar participants={participants} events={completion.events} locale={locale} />\n      <ConsultationTheater\n        participants={participants}\n        events={completion.events}\n        report={completion.report}\n        locale={locale}\n        selectedEventId={selectedEventId}\n        onSelectEvent={setSelectedEventId}\n      />'''
          portal_replace(needle, replacement, 'final open issues placement')
          portal.write_text(text)

          package = Path('package.json')
          text = package.read_text()
          old = 'node dist/tests/live-agenda.test.js && node dist/tests/automatic-team.test.js'
          new = 'node dist/tests/live-agenda.test.js && node dist/tests/open-issues.test.js && node dist/tests/automatic-team.test.js'
          if text.count(old) != 1:
              raise SystemExit(f'package test insertion: expected one match, got {text.count(old)}')
          package.write_text(text.replace(old, new, 1))

          showcase = Path('extension-public/consultation-showcase-bootstrap.js')
          text = showcase.read_text()
          anchor = '  const onUpdatedListeners = new Set();\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'showcase listener anchor: expected one match, got {text.count(anchor)}')
          listener = '''  const onUpdatedListeners = new Set();\n\n  window.addEventListener("chatchat:consultation-live", (event) => {\n    const phase = event.detail?.phase;\n    let attempts = 0;\n    const verifySecretariat = () => {\n      if (phase?.reason === "fresh_signal_follow_up") {\n        const agenda = document.querySelector('.live-agenda[data-phase-reason="fresh_signal_follow_up"]');\n        const triggers = agenda?.querySelectorAll(".live-agenda__trigger") ?? [];\n        if (agenda && triggers.length >= 1) {\n          document.documentElement.dataset.chatchatLiveAgendaShowcase = "complete";\n        }\n      }\n      const radar = document.querySelector(".open-issues-radar[data-open-issue-count]");\n      const count = Number(radar?.getAttribute("data-open-issue-count") ?? "0");\n      if (radar && count >= 1) {\n        document.documentElement.dataset.chatchatOpenIssuesShowcase = "complete";\n      }\n      if (\n        document.documentElement.dataset.chatchatLiveAgendaShowcase === "complete" &&\n        document.documentElement.dataset.chatchatOpenIssuesShowcase === "complete"\n      ) return;\n      attempts += 1;\n      if (attempts < 40) window.setTimeout(verifySecretariat, 25);\n    };\n    window.requestAnimationFrame(verifySecretariat);\n  });\n'''
          text = text.replace(anchor, listener, 1)

          completion = '            document.documentElement.dataset.chatchatConsultationShowcase = "complete";\n'
          count = text.count(completion)
          if count != 1:
              raise SystemExit(f'consultation complete marker: expected one match, got {count}')
          guarded = '''            if (\n              document.documentElement.dataset.chatchatLiveAgendaShowcase !== "complete" ||\n              document.documentElement.dataset.chatchatOpenIssuesShowcase !== "complete"\n            ) {\n              await delay(50);\n              continue;\n            }\n''' + completion
          text = text.replace(completion, guarded, 1)
          showcase.write_text(text)
          PY

      - name: Commit product wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/extension/components/LiveParticipantFloor.tsx src/extension/consultation-theater-portal.tsx package.json extension-public/consultation-showcase-bootstrap.js
          if git diff --cached --quiet; then
            echo "secretariat already wired"
          else
            git commit -m "Wire the meeting secretariat into live and replay surfaces"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
