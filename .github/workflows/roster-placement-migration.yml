name: Research Roster Placement Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Move roster above Blackboard and complete Chinese debate localization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          theater = Path('src/extension/components/ConsultationTheater.tsx')
          text = theater.read_text()
          old = 'import { ResearchRoster } from "./ResearchRoster.js";\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one ResearchRoster import, got {text.count(old)}')
          text = text.replace(old, '', 1)
          old = '''\n      {report.researchLaneAssignments ? (\n        <ResearchRoster\n          participants={participants}\n          assignments={report.researchLaneAssignments}\n          locale={locale}\n        />\n      ) : null}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one in-Theater ResearchRoster block, got {text.count(old)}')
          text = text.replace(old, '\n', 1)
          theater.write_text(text)

          portal = Path('src/extension/consultation-theater-portal.tsx')
          text = portal.read_text()
          def portal_replace(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'portal expected one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          portal_replace(
              'import { createRoot } from "react-dom/client";\n',
              'import { createPortal } from "react-dom";\nimport { createRoot } from "react-dom/client";\n',
          )
          portal_replace(
              'import { LiveParticipantFloor } from "./components/LiveParticipantFloor.js";\n',
              'import { LiveParticipantFloor } from "./components/LiveParticipantFloor.js";\nimport { ResearchRoster } from "./components/ResearchRoster.js";\n',
          )
          portal_replace(
              '''  const [archiveMode, setArchiveMode] = useState(false);\n  const [locale, setLocale] = useState<Locale>(() => normalizeLocale(document.documentElement.lang));\n  const [selectedEventId, setSelectedEventId] = useState<string | null>(null);\n''',
              '''  const [archiveMode, setArchiveMode] = useState(false);\n  const [locale, setLocale] = useState<Locale>(() => normalizeLocale(document.documentElement.lang));\n  const [selectedEventId, setSelectedEventId] = useState<string | null>(null);\n  const [researchRosterRoot, setResearchRosterRoot] = useState<HTMLElement | null>(null);\n''',
          )
          marker = '''  useEffect(() => {\n    const theaterRoot = document.getElementById("consultation-theater-root");\n'''
          insertion = '''  useEffect(() => {\n    const app = document.querySelector(".consultation-app");\n    if (!(app instanceof HTMLElement)) return;\n    let rosterRoot = document.getElementById("research-roster-root");\n    if (!(rosterRoot instanceof HTMLElement)) {\n      rosterRoot = document.createElement("div");\n      rosterRoot.id = "research-roster-root";\n      rosterRoot.dataset.chatchatOwned = "true";\n      app.append(rosterRoot);\n    }\n    setResearchRosterRoot(rosterRoot);\n    return () => {\n      setResearchRosterRoot(null);\n      if (rosterRoot?.dataset.chatchatOwned === "true") rosterRoot.remove();\n    };\n  }, []);\n\n  useEffect(() => {\n    if (!researchRosterRoot) return;\n    const app = document.querySelector(".consultation-app");\n    if (!(app instanceof HTMLElement)) return;\n    const board = app.querySelector(".shared-board-card");\n    const liveRoom = app.querySelector(".live-room-card");\n    if (board?.parentElement === app) {\n      app.insertBefore(researchRosterRoot, board);\n    } else if (liveRoom?.parentElement === app) {\n      liveRoom.insertAdjacentElement("afterend", researchRosterRoot);\n    } else {\n      app.append(researchRosterRoot);\n    }\n    researchRosterRoot.hidden = !completion?.report.researchLaneAssignments;\n  }, [researchRosterRoot, completion]);\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('portal placement insertion point changed')
          text = text.replace(marker, insertion + marker, 1)
          portal_replace(
              '''    <div className="consultation-theater-portal">\n      {archiveMode ? (''',
              '''    <div className="consultation-theater-portal">\n      {researchRosterRoot && completion.report.researchLaneAssignments\n        ? createPortal(\n            <ResearchRoster\n              participants={participants}\n              assignments={completion.report.researchLaneAssignments}\n              locale={locale}\n            />,\n            researchRosterRoot,\n          )\n        : null}\n      {archiveMode ? (''',
          )
          portal.write_text(text)

          bootstrap = Path('extension-public/consultation-showcase-bootstrap.js')
          demo = bootstrap.read_text()
          anchor = '    ["Bridge reliability and provider-page drift remain engineering risks.", "桥梁可靠性和 Provider 页面漂移仍然是工程风险。"],\n'
          if demo.count(anchor) != 1:
              raise SystemExit('Chinese translation map anchor changed')
          additions = '''    ["What evidence justifies maintaining two product cores instead of making the extension the authenticated workflow and the web app the demonstration surface?", "哪条证据足以证明应该长期维护两个产品核心，而不是让扩展负责已登录工作流、Web App 只承担展示与传播？"],\n    ["Which browser capability is actually unique enough to justify extension-first rather than merely convenient?", "到底哪项浏览器能力独特到足以支持‘扩展优先’，而不只是更方便？"],\n    ["Chrome extension documentation describes optional host permissions and runtime permission requests, supporting an extension architecture that asks only for the AI origins a user chooses.", "Chrome 扩展文档描述了可选站点权限和运行时权限请求，这支持一种只为用户实际选择的 AI 来源请求权限的扩展架构。"],\n    ["The source can support the permission mechanism, but it still does not by itself prove that extension-first maximizes adoption. We should keep that product claim narrower.", "这条来源可以支持权限机制本身，但仍不足以单独证明‘扩展优先’会最大化用户采用率。这个产品主张应该收窄。"],\n    ["I revise to Browser Extension first. ChatChat's tool observation confirms the cited public page is reachable and exposes relevant permission metadata; that does not prove the adoption claim, but it removes one implementation uncertainty while the authenticated multi-tab workflow remains the differentiator.", "我修正为‘Browser Extension 优先’。ChatChat 的工具观察确认所引用的公开页面可访问，并暴露了相关权限元数据；这不能证明采用率主张，但它消除了一个实现不确定性，而已登录、多标签协作仍然是关键差异化能力。"],\n    ["I support extension-first for the authenticated coordination layer, while keeping a lightweight public web room for sharing and onboarding.", "我支持让扩展负责已登录的协作层，同时保留一个轻量公开 Web Room 用于分享和 onboarding。"],\n'''
          demo = demo.replace(anchor, anchor + additions, 1)
          old = '''          const researchRoster = document.querySelector(".research-roster");\n          const replayLaneIds = new Set(\n            [...document.querySelectorAll("[data-research-roster-lane]")]\n              .map((node) => node.dataset.researchRosterLane)\n              .filter(Boolean),\n          );\n'''
          new = '''          const researchRoster = document.querySelector(".research-roster");\n          const sharedBoard = document.querySelector(".shared-board-card");\n          const replayLaneIds = new Set(\n            [...document.querySelectorAll("[data-research-roster-lane]")]\n              .map((node) => node.dataset.researchRosterLane)\n              .filter(Boolean),\n          );\n          const rosterBeforeBoard = researchRoster instanceof HTMLElement\n            && sharedBoard instanceof HTMLElement\n            && Boolean(researchRoster.compareDocumentPosition(sharedBoard) & Node.DOCUMENT_POSITION_FOLLOWING);\n'''
          if demo.count(old) != 1:
              raise SystemExit('Research Roster final proof block changed')
          demo = demo.replace(old, new, 1)
          old = '''            document.querySelector(".consultation-theater") &&\n            researchRoster && replayLaneIds.size >= 3\n          ) {\n            document.documentElement.dataset.chatchatResearchRosterShowcase = "complete";\n'''
          new = '''            document.querySelector(".consultation-theater") &&\n            researchRoster && replayLaneIds.size >= 3 && rosterBeforeBoard\n          ) {\n            document.documentElement.dataset.chatchatResearchRosterShowcase = "complete";\n            document.documentElement.dataset.chatchatResearchRosterPlacement = "above-blackboard";\n'''
          if demo.count(old) != 1:
              raise SystemExit('Research Roster completion condition changed')
          demo = demo.replace(old, new, 1)
          bootstrap.write_text(demo)
          PY

      - name: Commit product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/extension/components/ConsultationTheater.tsx src/extension/consultation-theater-portal.tsx extension-public/consultation-showcase-bootstrap.js
          if git diff --cached --quiet; then
            echo "product already migrated"
          else
            git commit -m "Move Research Roster above the Blackboard"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
