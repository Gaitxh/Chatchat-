name: npm ci Migration

on:
  pull_request:
    branches: [main]

jobs:
  migrate:
    name: Generate locked workflow candidates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Require committed lockfile
        run: |
          test -s package-lock.json
          node -e "const lock=require('./package-lock.json'); if(lock.lockfileVersion!==3) process.exit(1)"

      - name: Replace mutable installs
        run: |
          for file in \
            .github/workflows/ci.yml \
            .github/workflows/zero-config-ui.yml \
            .github/workflows/login-concierge-ui.yml \
            .github/workflows/real-provider-proof-ui.yml
          do
            sed -i 's/npm install$/npm ci/' "$file"
          done
          ! grep -R --line-number --fixed-strings 'npm install' \
            .github/workflows/ci.yml \
            .github/workflows/zero-config-ui.yml \
            .github/workflows/login-concierge-ui.yml \
            .github/workflows/real-provider-proof-ui.yml
          grep -R --line-number --fixed-strings 'npm ci' \
            .github/workflows/ci.yml \
            .github/workflows/zero-config-ui.yml \
            .github/workflows/login-concierge-ui.yml \
            .github/workflows/real-provider-proof-ui.yml

      - name: Stage generated workflow candidates
        run: |
          mkdir -p workflow-candidates
          cp .github/workflows/ci.yml workflow-candidates/ci.yml
          cp .github/workflows/zero-config-ui.yml workflow-candidates/zero-config-ui.yml
          cp .github/workflows/login-concierge-ui.yml workflow-candidates/login-concierge-ui.yml
          cp .github/workflows/real-provider-proof-ui.yml workflow-candidates/real-provider-proof-ui.yml

      - name: Upload generated workflow candidates
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-npm-ci-workflows
          path: workflow-candidates/*.yml
          if-no-files-found: error
          retention-days: 2
