name: Real Provider Proof UI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chatchat-real-provider-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof-ui:
    name: Real Provider Proof · demo-only browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build production extension
        run: |
          npm install
          npm run check
          npm test
          npm run build:extension

      - name: Install CJK screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium browser
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start production preview
        run: |
          mkdir -p artifacts
          nohup python3 -m http.server 4183 --bind 127.0.0.1 --directory dist-extension > /tmp/chatchat-real-provider-proof-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4183/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4183/manifest.json >/dev/null

      - name: Capture English Real Provider Proof preview
        run: |
          URL='http://127.0.0.1:4183/app/app.html?showcase=real-provider-proof&lang=en'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=9000 \
            --window-size=1440,1900 \
            --screenshot=artifacts/chatchat-real-provider-proof-en.png \
            "$URL"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=9000 \
            --dump-dom \
            "$URL" > artifacts/chatchat-real-provider-proof-en.html
          test -s artifacts/chatchat-real-provider-proof-en.png
          grep -q 'data-chatchat-real-provider-proof-showcase="complete"' artifacts/chatchat-real-provider-proof-en.html
          grep -q 'data-gate-b-verdict="demo-only"' artifacts/chatchat-real-provider-proof-en.html
          grep -q 'REAL PROVIDER PROOF' artifacts/chatchat-real-provider-proof-en.html
          grep -q 'DEMO ONLY' artifacts/chatchat-real-provider-proof-en.html
          grep -q 'chatgpt.com' artifacts/chatchat-real-provider-proof-en.html
          grep -q 'claude.ai' artifacts/chatchat-real-provider-proof-en.html
          grep -q 'Excludes the user proposal' artifacts/chatchat-real-provider-proof-en.html
          ! grep -q 'ROYAL PROOF PACK' artifacts/chatchat-real-provider-proof-en.html
          ! grep -q "KING'S COMMAND" artifacts/chatchat-real-provider-proof-en.html

      - name: Capture Chinese Real Provider Proof preview
        run: |
          URL='http://127.0.0.1:4183/app/app.html?showcase=real-provider-proof&lang=zh'
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=9000 \
            --window-size=1440,1900 \
            --screenshot=artifacts/chatchat-real-provider-proof-zh.png \
            "$URL"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=9000 \
            --dump-dom \
            "$URL" > artifacts/chatchat-real-provider-proof-zh.html
          test -s artifacts/chatchat-real-provider-proof-zh.png
          grep -q 'data-chatchat-real-provider-proof-showcase="complete"' artifacts/chatchat-real-provider-proof-zh.html
          grep -q 'data-gate-b-verdict="demo-only"' artifacts/chatchat-real-provider-proof-zh.html
          grep -q '真实 PROVIDER 验收' artifacts/chatchat-real-provider-proof-zh.html
          grep -q '仅演示' artifacts/chatchat-real-provider-proof-zh.html
          grep -q 'chatgpt.com' artifacts/chatchat-real-provider-proof-zh.html
          grep -q 'claude.ai' artifacts/chatchat-real-provider-proof-zh.html
          grep -q '不包含用户提案' artifacts/chatchat-real-provider-proof-zh.html
          ! grep -q '御前验收' artifacts/chatchat-real-provider-proof-zh.html
          ! grep -q '众议院' artifacts/chatchat-real-provider-proof-zh.html

      - name: Save preview log
        if: always()
        run: cp /tmp/chatchat-real-provider-proof-preview.log artifacts/preview.log 2>/dev/null || true

      - name: Upload Real Provider Proof browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-real-provider-proof-ui
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
