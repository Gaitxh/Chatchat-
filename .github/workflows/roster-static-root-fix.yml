name: Static Research Roster Root Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use the static roster mount instead of creating it before ConsultationApp exists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/extension/consultation-theater-portal.tsx')
          text = path.read_text()

          old = '  const [researchRosterRoot, setResearchRosterRoot] = useState<HTMLElement | null>(null);\n'
          if text.count(old) != 1:
              raise SystemExit('researchRosterRoot state declaration changed')
          text = text.replace(old, '', 1)

          old = '''  useEffect(() => {\n    const app = document.querySelector(".consultation-app");\n    if (!(app instanceof HTMLElement)) return;\n    let rosterRoot = document.getElementById("research-roster-root");\n    if (!(rosterRoot instanceof HTMLElement)) {\n      rosterRoot = document.createElement("div");\n      rosterRoot.id = "research-roster-root";\n      rosterRoot.dataset.chatchatOwned = "true";\n      app.append(rosterRoot);\n    }\n    setResearchRosterRoot(rosterRoot);\n    return () => {\n      setResearchRosterRoot(null);\n      if (rosterRoot?.dataset.chatchatOwned === "true") rosterRoot.remove();\n    };\n  }, []);\n\n  useEffect(() => {\n    if (!researchRosterRoot) return;\n    const app = document.querySelector(".consultation-app");\n    if (!(app instanceof HTMLElement)) return;\n    const board = app.querySelector(".shared-board-card");\n    const liveRoom = app.querySelector(".live-room-card");\n    if (board?.parentElement === app) {\n      app.insertBefore(researchRosterRoot, board);\n    } else if (liveRoom?.parentElement === app) {\n      liveRoom.insertAdjacentElement("afterend", researchRosterRoot);\n    } else {\n      app.append(researchRosterRoot);\n    }\n    researchRosterRoot.hidden = !completion?.report.researchLaneAssignments;\n  }, [researchRosterRoot, completion]);\n\n'''
          new = '''  useEffect(() => {\n    const researchRosterRoot = document.getElementById("research-roster-root");\n    const app = document.querySelector(".consultation-app");\n    if (!(researchRosterRoot instanceof HTMLElement) || !(app instanceof HTMLElement)) return;\n    const board = app.querySelector(".shared-board-card");\n    const liveRoom = app.querySelector(".live-room-card");\n    if (board?.parentElement === app) {\n      app.insertBefore(researchRosterRoot, board);\n    } else if (liveRoom?.parentElement === app) {\n      liveRoom.insertAdjacentElement("afterend", researchRosterRoot);\n    } else {\n      app.append(researchRosterRoot);\n    }\n    researchRosterRoot.hidden = !completion?.report.researchLaneAssignments;\n  }, [completion]);\n\n'''
          if text.count(old) != 1:
              raise SystemExit('dynamic roster-root effects changed')
          text = text.replace(old, new, 1)

          old = '''  if (!completion) return null;\n  const participants = completion.report.positions.map((position) => position.participant);\n  return (\n'''
          new = '''  if (!completion) return null;\n  const participants = completion.report.positions.map((position) => position.participant);\n  const researchRosterRoot = document.getElementById("research-roster-root");\n  return (\n'''
          if text.count(old) != 1:
              raise SystemExit('final portal render insertion point changed')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/extension/consultation-theater-portal.tsx
          if git diff --cached --quiet; then
            echo "portal already fixed"
          else
            git commit -m "Use a stable Research Roster mount"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
