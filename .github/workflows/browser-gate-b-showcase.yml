name: Browser Gate B Showcase

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate-b-proof-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build Browser Extension
        run: npm run build:extension
      - name: Install screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Start extension preview
        run: |
          mkdir -p artifacts
          nohup python3 -m http.server 4180 --bind 127.0.0.1 --directory dist-extension > /tmp/chatchat-gate-b-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4180/manifest.json >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4180/manifest.json >/dev/null
      - name: Capture Browser Gate B Royal Proof showcase
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          URL='http://127.0.0.1:4180/extension/sidepanel.html?showcase=gate-b'
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=7000 --window-size=520,1450 --screenshot=artifacts/chatchat-extension-gate-b-proof.png "$URL"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --run-all-compositor-stages-before-draw --virtual-time-budget=7000 --dump-dom "$URL" > artifacts/chatchat-extension-gate-b-proof.html
          test -s artifacts/chatchat-extension-gate-b-proof.png
          test -s artifacts/chatchat-extension-gate-b-proof.html
      - name: Upload Browser Gate B proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatchat-extension-gate-b-proof
          path: |
            artifacts/chatchat-extension-gate-b-proof.png
            artifacts/chatchat-extension-gate-b-proof.html
          if-no-files-found: warn
          retention-days: 14
      - name: Assert Browser Gate B proof privacy boundary
        run: |
          FILE=artifacts/chatchat-extension-gate-b-proof.html
          grep -q 'data-chatchat-gate-b-showcase="booted"' "$FILE"
          grep -q 'id="chatchat-browser-proof"' "$FILE"
          grep -q 'data-proof-privacy="metadata-only"' "$FILE"
          grep -q 'data-proof-source="browser-house"' "$FILE"
          grep -q 'data-gate-b-verdict="gate-b-candidate"' "$FILE"
          grep -q 'data-gate-b-providers="2"' "$FILE"
          grep -q 'data-gate-b-rounds="3"' "$FILE"
          grep -q 'data-gate-b-uncertain="0"' "$FILE"
          grep -q 'GATE B CANDIDATE' "$FILE"
          grep -q 'COPY ISSUE MARKDOWN' "$FILE"
          grep -q 'COPY JSON' "$FILE"
          grep -q 'openai-chatgpt' "$FILE"
          grep -q 'deepseek-chat' "$FILE"
          grep -q 'METADATA ONLY' "$FILE"
