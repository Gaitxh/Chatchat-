<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">ChatChat current consultation architecture</title><desc id="desc">Proposal, structural conflict threads, explicit stance fronts, final position floor, and execution integrity.</desc><rect width="1440" height="1080" fill="#f8f6f0"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="72" y="66" font-size="15" font-weight="800" letter-spacing="2.2" fill="#788177">CHATCHAT · PROPOSAL IN → DECISION INTELLIGENCE OUT</text><text x="72" y="110" font-size="31" font-weight="800" fill="#222823">A real consultation is more than multiple answers</text><text x="72" y="142" font-size="17" fill="#5f675f">Public events, structural disputes, explicit stance movement, final-seat accounting, and Provider execution audit stay separate.</text><rect x="72" y="190" width="285" height="220" rx="26" fill="#fffdf9" stroke="#dedbd3"/><text x="96" y="225" font-size="14" font-weight="800" fill="#788177">01 · SEALED + RESEARCH</text><text x="96" y="264" font-size="26" font-weight="800" fill="#222823">Independent first</text><text x="96" y="302" font-size="16" fill="#5f675f">R1 cannot see peer answers.</text><text x="96" y="342" font-size="14" font-weight="750" fill="#4d5d51">LIVE RESEARCH DESK</text><text x="96" y="372" font-size="14" fill="#737b74">equal research lanes</text><rect x="385" y="190" width="305" height="220" rx="26" fill="#fffdf9" stroke="#dedbd3"/><text x="409" y="225" font-size="14" font-weight="800" fill="#788177">02 · BLACKBOARD DEBATE</text><text x="409" y="264" font-size="26" font-weight="800" fill="#222823">Reply with receipts</text><text x="409" y="302" font-size="16" fill="#5f675f">challenge · evidence · question</text><text x="409" y="342" font-size="14" font-weight="750" fill="#4d5d51">PEER EXCHANGE · LIVE AGENDA</text><text x="409" y="374" font-size="13" fill="#737b74">replyToEventId · targetEventId · causedBy</text><rect x="718" y="190" width="305" height="220" rx="26" fill="#fffdf9" stroke="#dedbd3"/><text x="742" y="225" font-size="14" font-weight="800" fill="#788177">03 · STRUCTURAL CONFLICT</text><text x="742" y="264" font-size="26" font-weight="800" fill="#222823">What are they fighting over?</text><text x="742" y="310" font-size="14" font-weight="750" fill="#805f55">CONFLICT BOARD · RESOLUTION LEDGER</text><text x="742" y="348" font-size="14" fill="#737b74">OPEN debt stays open until exact provenance resolves it.</text><text x="742" y="378" font-size="14" fill="#737b74">No embeddings. No hidden summary chair.</text><rect x="1051" y="190" width="317" height="220" rx="26" fill="#fffdf9" stroke="#dedbd3"/><text x="1075" y="225" font-size="14" font-weight="800" fill="#788177">04 · EXPLICIT STANCE FRONTS</text><text x="1075" y="264" font-size="26" font-weight="800" fill="#222823">Who actually stood where?</text><rect x="1075" y="300" width="104" height="34" rx="17" fill="#e7f1e8"/><text x="1090" y="322" font-size="13" font-weight="760" fill="#4d5d51">CURRENT</text><rect x="1190" y="300" width="104" height="34" rx="17" fill="#f2e9e5"/><text x="1206" y="322" font-size="13" font-weight="760" fill="#805f55">VACATED</text><text x="1075" y="370" font-size="14" fill="#737b74">Pressure ≠ inferred camp membership.</text><path d="M120 468 H1320" stroke="#b8c3b8" stroke-width="2" stroke-dasharray="7 8"/><text x="72" y="505" font-size="15" font-weight="800" letter-spacing="2" fill="#788177">MEETING CLOSE · FINAL REPORT SEATS ≠ THREAD-LOCAL FRONTS</text><rect x="72" y="540" width="760" height="355" rx="30" fill="#fffdf9" stroke="#d9ddd7"/><text x="100" y="578" font-size="14" font-weight="800" fill="#788177">FINAL POSITION FLOOR · MEETING-WIDE</text><text x="100" y="620" font-size="30" font-weight="800" fill="#222823">What was recorded for every final seat?</text><text x="100" y="650" font-size="16" fill="#5f675f">Report accounting stays separate from thread-local fronts.</text><rect x="100" y="682" width="440" height="92" rx="18" fill="#edf5ee"/><text x="122" y="712" font-size="13" font-weight="800" fill="#607965">REPORT LEADING GROUP · DESCRIPTIVE</text><text x="122" y="747" font-size="25" font-weight="800" fill="#222823">Web + Extension · 5/6 · 83%</text><rect x="558" y="682" width="246" height="92" rx="18" fill="#f5eee8"/><text x="580" y="712" font-size="13" font-weight="800" fill="#87695c">MINORITY SURVIVES</text><text x="580" y="747" font-size="22" font-weight="800" fill="#222823">Browser Extension · 1</text><text x="100" y="810" font-size="14" font-weight="750" fill="#4d5d51">✓ provider_final</text><text x="285" y="810" font-size="14" font-weight="750" fill="#8b5148">≈ fallback_placeholder</text><text x="535" y="810" font-size="14" font-weight="750" fill="#737b74">? unverified_record</text><text x="100" y="850" font-size="14" fill="#737b74">explicit revision receipt ≠ verified Final shift without a matching revision receipt</text><rect x="862" y="540" width="506" height="355" rx="30" fill="#223029"/><text x="890" y="578" font-size="14" font-weight="800" fill="#9fb8a7">MEETING EXECUTION INTEGRITY</text><text x="890" y="622" font-size="30" font-weight="800" fill="#f4f8f5">Did the Providers really complete?</text><text x="890" y="657" font-size="16" fill="#c4d0c8">Alignment and execution coverage are different facts.</text><rect x="890" y="692" width="202" height="92" rx="18" fill="#2f4438"/><text x="912" y="724" font-size="13" font-weight="750" fill="#a9c5b1">STANCE ALIGNMENT</text><text x="912" y="762" font-size="32" font-weight="850" fill="#fff">83%</text><rect x="1108" y="692" width="232" height="92" rx="18" fill="#2f4438"/><text x="1130" y="724" font-size="13" font-weight="750" fill="#a9c5b1">VERIFIED TURNS</text><text x="1130" y="762" font-size="32" font-weight="850" fill="#fff">12 / 12</text><text x="890" y="818" font-size="16" fill="#d6dfd9">Neither number is an answer-correctness score.</text><text x="890" y="852" font-size="14" fill="#9fb0a5">Durable execution receipt · local replay · zero Provider calls</text><rect x="72" y="938" width="1296" height="96" rx="24" fill="#fffdf9" stroke="#dedbd3"/><text x="98" y="969" font-size="14" font-weight="800" fill="#788177">REAL PRODUCT PROOF</text><text x="98" y="1004" font-size="16" fill="#5f675f">Same-session CDP ready marker → paint → PNG + DOM → nonblank pixel validation → semantic validator</text><text x="1110" y="1004" font-size="13" font-weight="760" fill="#9a3412">DEMO · SYNTHETIC ≠ LIVE AI</text></g></svg>