<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-label="ChatChat real live consultation meeting demo">
  <rect width="1800" height="1050" rx="38" fill="#f7f5f0"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="82" fill="#171715" font-size="48" font-weight="720" letter-spacing="-1.3">Watch the meeting happen — not just the last answer.</text>
    <text x="74" y="120" fill="#77736c" font-size="17">真实 Chromium 验证链 · public structured actions only · no invented private reasoning</text>

    <!-- 01 -->
    <g transform="translate(60 164)">
      <rect width="400" height="790" rx="26" fill="#fffdf9" stroke="#dedad2"/>
      <rect x="18" y="18" width="364" height="76" rx="20" fill="#dfe9df"/>
      <text x="38" y="49" fill="#223227" font-size="15" font-weight="800">01 · PROPOSAL + SEALED</text>
      <text x="38" y="75" fill="#5e6c61" font-size="12">先独立，再互相影响</text>

      <rect x="18" y="112" width="364" height="128" rx="20" fill="#1d1d1b"/>
      <text x="36" y="140" fill="#aaa8a3" font-size="9" font-weight="760" letter-spacing="1">USER PROPOSAL</text>
      <text x="36" y="177" fill="#fff" font-size="21" font-weight="680">Web-first room, invisible</text>
      <text x="36" y="205" fill="#fff" font-size="21" font-weight="680">browser bridge — or both?</text>
      <text x="36" y="226" fill="#aaa8a3" font-size="10">One proposal. Equal participants.</text>

      <text x="20" y="278" fill="#77736c" font-size="10" font-weight="800" letter-spacing="1">LIVE PARTICIPANTS · R1 SEALED</text>
      <g transform="translate(18 296)">
        <rect width="364" height="66" rx="15" fill="#f2f0ea"/>
        <circle cx="29" cy="33" r="17" fill="#262522"/><text x="29" y="38" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">G</text>
        <text x="58" y="29" fill="#1f1e1b" font-size="14" font-weight="700">ChatGPT</text><text x="58" y="48" fill="#74716b" font-size="10">forming independent view</text>
      </g>
      <g transform="translate(18 372)">
        <rect width="364" height="66" rx="15" fill="#f2f0ea"/>
        <circle cx="29" cy="33" r="17" fill="#262522"/><text x="29" y="38" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">C</text>
        <text x="58" y="29" fill="#1f1e1b" font-size="14" font-weight="700">Claude</text><text x="58" y="48" fill="#74716b" font-size="10">forming independent view</text>
      </g>
      <g transform="translate(18 448)">
        <rect width="364" height="66" rx="15" fill="#f2f0ea"/>
        <circle cx="29" cy="33" r="17" fill="#262522"/><text x="29" y="38" fill="#fff" text-anchor="middle" font-size="9" font-weight="700">Gm</text>
        <text x="58" y="29" fill="#1f1e1b" font-size="14" font-weight="700">Gemini</text><text x="58" y="48" fill="#74716b" font-size="10">forming independent view</text>
      </g>

      <text x="20" y="554" fill="#77736c" font-size="10" font-weight="800" letter-spacing="1">LIVE RESEARCH</text>
      <g transform="translate(18 572)">
        <rect width="364" height="160" rx="17" fill="#eef1ec"/>
        <text x="16" y="29" fill="#426248" font-size="10" font-weight="800">DIFFERENT MISSION · EQUAL AUTHORITY</text>
        <text x="16" y="58" fill="#2b312c" font-size="12" font-weight="680">ChatGPT  · verify primary premise</text>
        <text x="16" y="86" fill="#2b312c" font-size="12" font-weight="680">Claude   · strongest counterexample</text>
        <text x="16" y="114" fill="#2b312c" font-size="12" font-weight="680">Gemini   · implementation constraints</text>
        <text x="16" y="143" fill="#748078" font-size="9">Balanced also receives Research Lanes.</text>
      </g>
    </g>

    <!-- 02 -->
    <g transform="translate(486 164)">
      <rect width="400" height="790" rx="26" fill="#fffdf9" stroke="#dedad2"/>
      <rect x="18" y="18" width="364" height="76" rx="20" fill="#eee8df"/>
      <text x="38" y="49" fill="#514a42" font-size="15" font-weight="800">02 · PROCEDURE IS VISIBLE</text>
      <text x="38" y="75" fill="#756d64" font-size="12">为什么还要继续？还有什么没解决？</text>

      <text x="20" y="132" fill="#77736c" font-size="10" font-weight="800" letter-spacing="1">LIVE AGENDA</text>
      <g transform="translate(18 148)">
        <rect width="364" height="160" rx="18" fill="#f2edfa"/>
        <rect x="16" y="14" width="174" height="24" rx="12" fill="#e4daf6"/>
        <text x="103" y="30" fill="#5b4d82" text-anchor="middle" font-size="9" font-weight="800">FRESH SIGNAL FOLLOW-UP</text>
        <text x="16" y="66" fill="#2b2536" font-size="13" font-weight="700">Another public round exists because</text>
        <text x="16" y="88" fill="#2b2536" font-size="13" font-weight="700">new peer-response signals appeared.</text>
        <text x="16" y="118" fill="#796d8d" font-size="10">triggerEventId → Claude question</text>
        <text x="16" y="140" fill="#796d8d" font-size="10">click to trace the exact public event</text>
      </g>

      <text x="20" y="350" fill="#77736c" font-size="10" font-weight="800" letter-spacing="1">OPEN ISSUES</text>
      <g transform="translate(18 366)">
        <rect width="364" height="225" rx="18" fill="#fbf1e8"/>
        <text x="16" y="30" fill="#8a583d" font-size="10" font-weight="800">EVENT-BACKED · NOT “SOUNDS RESOLVED”</text>
        <g transform="translate(14 48)"><rect width="336" height="67" rx="13" fill="#fffaf5"/><text x="13" y="24" fill="#60493d" font-size="11" font-weight="700">? Claude → ChatGPT</text><text x="13" y="44" fill="#84766e" font-size="9">login recovery question awaits exact reply</text><text x="13" y="58" fill="#9b877b" font-size="8">source event preserved</text></g>
        <g transform="translate(14 126)"><rect width="336" height="67" rx="13" fill="#fffaf5"/><text x="13" y="24" fill="#60493d" font-size="11" font-weight="700">⚔ ChatGPT → Claude</text><text x="13" y="44" fill="#84766e" font-size="9">targeted challenge still needs owner response</text><text x="13" y="58" fill="#9b877b" font-size="8">third-party prose cannot discharge it</text></g>
        <text x="16" y="211" fill="#9b7663" font-size="9">A meeting may close with issues still open.</text>
      </g>

      <g transform="translate(18 620)">
        <rect width="364" height="112" rx="18" fill="#1d1d1b"/>
        <text x="16" y="28" fill="#aaa8a3" font-size="9" font-weight="800" letter-spacing="1">MEETING SECRETARIAT</text>
        <text x="16" y="57" fill="#fff" font-size="15" font-weight="680">Protocol view — not a chair AI.</text>
        <text x="16" y="82" fill="#d6d1c9" font-size="11">Majority stays descriptive.</text>
        <text x="16" y="101" fill="#aaa8a3" font-size="9">No hidden moderator decides who is right.</text>
      </g>
    </g>

    <!-- 03 -->
    <g transform="translate(912 164)">
      <rect width="400" height="790" rx="26" fill="#fffdf9" stroke="#dedad2"/>
      <rect x="18" y="18" width="364" height="76" rx="20" fill="#e5e8f5"/>
      <text x="38" y="49" fill="#3f4667" font-size="15" font-weight="800">03 · PEERS ACTUALLY TALK</text>
      <text x="38" y="75" fill="#646b8c" font-size="12">点名、接手、回答、反驳、改口</text>

      <text x="20" y="132" fill="#77736c" font-size="10" font-weight="800" letter-spacing="1">PEER EXCHANGE</text>
      <g transform="translate(18 148)">
        <rect width="364" height="184" rx="18" fill="#f2f2f8"/>
        <text x="16" y="30" fill="#596180" font-size="11" font-weight="800">Claude → ChatGPT</text>
        <text x="16" y="54" fill="#737992" font-size="9">“How should the Web Room recover after login?”</text>
        <g transform="translate(16 76)"><circle cx="9" cy="9" r="8" fill="#8b81a8"/><text x="26" y="13" fill="#5a536e" font-size="10" font-weight="700">QUEUED</text><line x1="92" y1="9" x2="132" y2="9" stroke="#c7c2d4" stroke-width="2"/></g>
        <g transform="translate(134 76)"><circle cx="9" cy="9" r="8" fill="#788bd0"/><text x="26" y="13" fill="#52618d" font-size="10" font-weight="700">TARGET TURN</text><line x1="108" y1="9" x2="144" y2="9" stroke="#c7c2d4" stroke-width="2"/></g>
        <g transform="translate(282 76)"><circle cx="9" cy="9" r="8" fill="#68a187"/><text x="26" y="13" fill="#47735f" font-size="10" font-weight="700">ANSWERED</text></g>
        <text x="16" y="127" fill="#77748a" font-size="9">Response event is preserved after the answer lands.</text>
        <text x="16" y="150" fill="#77748a" font-size="9">Similar prose and third-party answers do not clear the queue.</text>
        <text x="16" y="170" fill="#77748a" font-size="9">Failed turn / unresolved-at-close remain visible.</text>
      </g>

      <text x="20" y="374" fill="#77736c" font-size="10" font-weight="800" letter-spacing="1">DIRECT REPLY</text>
      <g transform="translate(18 390)">
        <rect width="364" height="128" rx="18" fill="#edf1f9"/>
        <text x="16" y="29" fill="#4d5e86" font-size="10" font-weight="800">↪ ChatGPT answers Claude</text>
        <text x="16" y="55" fill="#3f4656" font-size="11">Web Room exposes only the recovery moment,</text>
        <text x="16" y="74" fill="#3f4656" font-size="11">then resumes the same consultation.</text>
        <text x="16" y="101" fill="#667393" font-size="9">replyToEventId = exact Claude question event</text>
        <text x="16" y="117" fill="#8b91a2" font-size="8">also becomes a Relationship Map reply edge</text>
      </g>

      <text x="20" y="560" fill="#77736c" font-size="10" font-weight="800" letter-spacing="1">EXPLICIT REVISION</text>
      <g transform="translate(18 576)">
        <rect width="364" height="156" rx="18" fill="#f3ece8"/>
        <text x="16" y="29" fill="#765746" font-size="10" font-weight="800">CLAUDE CHANGES POSITION</text>
        <rect x="16" y="48" width="126" height="31" rx="15" fill="#fffdf9"/><text x="79" y="68" fill="#625f59" text-anchor="middle" font-size="10">Web + Extension</text>
        <text x="158" y="70" fill="#7c6ee6" font-size="19">→</text>
        <rect x="196" y="48" width="150" height="31" rx="15" fill="#e8e5fa"/><text x="271" y="68" fill="#544aa6" text-anchor="middle" font-size="10" font-weight="700">Extension first</text>
        <text x="16" y="106" fill="#74716b" font-size="9">causedBy: public challenge + evidence events</text>
        <text x="16" y="128" fill="#74716b" font-size="9">Strong influence exists only with explicit provenance.</text>
        <text x="16" y="146" fill="#9b918b" font-size="8">Drama is allowed. Invented persuasion is not.</text>
      </g>
    </g>

    <!-- 04 -->
    <g transform="translate(1338 164)">
      <rect width="400" height="790" rx="26" fill="#fffdf9" stroke="#dedad2"/>
      <rect x="18" y="18" width="364" height="76" rx="20" fill="#eadfd5"/>
      <text x="38" y="49" fill="#62483a" font-size="15" font-weight="800">04 · OUTCOME WITH RECEIPTS</text>
      <text x="38" y="75" fill="#806453" font-size="12">结果、异议和没解决的问题一起留下</text>

      <g transform="translate(18 118)">
        <rect width="364" height="142" rx="18" fill="#f6f4ef"/>
        <text x="16" y="28" fill="#77736c" font-size="9" font-weight="800" letter-spacing="1">CONSULTATION OUTCOME</text>
        <text x="16" y="59" fill="#22211f" font-size="19" font-weight="700">Extension first</text>
        <text x="16" y="84" fill="#74716b" font-size="10">Alignment 80% · descriptive only</text>
        <text x="16" y="105" fill="#74716b" font-size="10">Minority rationale preserved</text>
        <text x="16" y="126" fill="#9b6e57" font-size="10">1 Open Issue survives the round budget</text>
      </g>

      <g transform="translate(18 278)">
        <rect width="364" height="166" rx="18" fill="#fbf1e8"/>
        <text x="16" y="29" fill="#8a583d" font-size="9" font-weight="800" letter-spacing="1">OPEN ISSUES AT CLOSE</text>
        <text x="16" y="61" fill="#60493d" font-size="12" font-weight="700">? one direct question remains unanswered</text>
        <text x="16" y="86" fill="#60493d" font-size="12" font-weight="700">⚔ one claim remains challenged</text>
        <text x="16" y="111" fill="#60493d" font-size="12" font-weight="700">≈ one explicit uncertainty remains</text>
        <text x="16" y="141" fill="#947463" font-size="9">Closing a meeting never rewrites these into fake consensus.</text>
      </g>

      <g transform="translate(18 462)">
        <rect width="364" height="126" rx="18" fill="#f2efe9"/>
        <text x="16" y="28" fill="#77736c" font-size="9" font-weight="800" letter-spacing="1">LOCAL REPLAY</text>
        <text x="16" y="57" fill="#22211f" font-size="13" font-weight="700">▶ trace challenge → reply → revision</text>
        <rect x="16" y="75" width="332" height="3" rx="2" fill="#ded9d1"/><rect x="16" y="75" width="232" height="3" rx="2" fill="#7c6ee6"/>
        <text x="16" y="103" fill="#74716b" font-size="9">Saved structured events only.</text>
        <text x="16" y="118" fill="#74716b" font-size="9">No Provider call. No invented explanation.</text>
      </g>

      <g transform="translate(18 606)">
        <rect width="364" height="126" rx="18" fill="#1d1d1b"/>
        <text x="16" y="28" fill="#aaa8a3" font-size="9" font-weight="800" letter-spacing="1">REAL PRODUCT PROOF</text>
        <text x="16" y="56" fill="#fff" font-size="14" font-weight="680">Chromium must witness the chain.</text>
        <text x="16" y="80" fill="#d6d1c9" font-size="10">research · agenda · open issue · reply · revision</text>
        <text x="16" y="99" fill="#d6d1c9" font-size="10">peer lifecycle · relationship reply edge</text>
        <text x="16" y="116" fill="#aaa8a3" font-size="8">README claims are guarded against production proof.</text>
      </g>
    </g>

    <text x="70" y="1005" fill="#807b74" font-size="13">ChatChat shows public protocol actions and provenance. It does not expose or fabricate private model chain-of-thought.</text>
  </g>
</svg>
