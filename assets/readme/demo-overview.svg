<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="ChatChat three-act consultation demo">
<rect width="1600" height="900" rx="36" fill="#f7f5f0"/>
<g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<text x="70" y="86" fill="#171715" font-size="52" font-weight="690" letter-spacing="-1.4">See the consultation — not just the last answer.</text>
<text x="72" y="124" fill="#77736c" font-size="18">真实协商过程 · sealed opinions · shared evidence · explicit revisions</text>

<g transform="translate(70 176)"><rect width="430" height="640" rx="26" fill="#fffdf9" stroke="#dedad2"/><rect x="18" y="18" width="394" height="78" rx="20" fill="#dfe9df"/><text x="38" y="51" fill="#223227" font-size="16" font-weight="760">01 · SEALED OPINIONS</text><text x="38" y="77" fill="#5e6c61" font-size="13">先独立思考，再开始影响</text>
<rect x="18" y="116" width="394" height="148" rx="22" fill="#1d1d1b"/><text x="38" y="150" fill="#aeadab" font-size="11" letter-spacing="1.2">USER PROPOSAL</text><text x="38" y="184" fill="#fff" font-size="25" font-weight="650">Browser extension, web app,</text><text x="38" y="214" fill="#fff" font-size="25" font-weight="650">or both?</text><text x="38" y="242" fill="#aaa8a3" font-size="12">Each AI sees the same proposal — nobody else’s answer.</text>
<g transform="translate(18 286)"><text x="0" y="18" fill="#77736c" font-size="11" font-weight="730" letter-spacing="1">EQUAL PARTICIPANTS</text><g transform="translate(0 36)"><rect width="394" height="72" rx="16" fill="#f2f0ea"/><circle cx="30" cy="36" r="18" fill="#262522"/><text x="30" y="41" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">G</text><text x="61" y="31" fill="#1f1e1b" font-size="15" font-weight="680">ChatGPT</text><text x="61" y="51" fill="#74716b" font-size="11">Browser Extension · 78%</text></g><g transform="translate(0 120)"><rect width="394" height="72" rx="16" fill="#f2f0ea"/><circle cx="30" cy="36" r="18" fill="#262522"/><text x="30" y="41" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">C</text><text x="61" y="31" fill="#1f1e1b" font-size="15" font-weight="680">Claude</text><text x="61" y="51" fill="#74716b" font-size="11">Web + Extension · 72%</text></g><g transform="translate(0 204)"><rect width="394" height="72" rx="16" fill="#f2f0ea"/><circle cx="30" cy="36" r="18" fill="#262522"/><text x="30" y="41" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">Gm</text><text x="61" y="31" fill="#1f1e1b" font-size="15" font-weight="680">Gemini</text><text x="61" y="51" fill="#74716b" font-size="11">Browser Extension · 81%</text></g></g></g>

<g transform="translate(585 176)"><rect width="430" height="640" rx="26" fill="#fffdf9" stroke="#dedad2"/><rect x="18" y="18" width="394" height="78" rx="20" fill="#eee8df"/><text x="38" y="51" fill="#514a42" font-size="16" font-weight="760">02 · OPEN CONSULTATION</text><text x="38" y="77" fill="#756d64" font-size="13">共享 Blackboard，但所有参与者仍然平等</text>
<text x="20" y="133" fill="#77736c" font-size="11" font-weight="730" letter-spacing="1">BLACKBOARD · ROUND 2</text>
<g transform="translate(18 152)"><rect width="394" height="90" rx="16" fill="#f6f4ef"/><rect x="16" y="14" width="82" height="25" rx="12" fill="#ebe6df"/><text x="57" y="31" fill="#625c54" text-anchor="middle" font-size="10" font-weight="730">CHALLENGE</text><text x="16" y="61" fill="#262522" font-size="13" font-weight="610">ChatGPT → Claude</text><text x="16" y="79" fill="#74716b" font-size="11">What evidence makes two products better than one?</text></g>
<g transform="translate(18 256)"><rect width="394" height="100" rx="16" fill="#f6f4ef"/><rect x="16" y="14" width="76" height="25" rx="12" fill="#dfe9df"/><text x="54" y="31" fill="#426248" text-anchor="middle" font-size="10" font-weight="730">EVIDENCE</text><text x="16" y="61" fill="#262522" font-size="13" font-weight="610">Gemini → shared board</text><text x="16" y="80" fill="#74716b" font-size="11">Logged-in browser sessions are the unique workflow.</text></g>
<g transform="translate(18 370)"><rect width="394" height="96" rx="16" fill="#f6f4ef"/><rect x="16" y="14" width="70" height="25" rx="12" fill="#e8e5fa"/><text x="51" y="31" fill="#544aa6" text-anchor="middle" font-size="10" font-weight="730">SUPPORT</text><text x="16" y="61" fill="#262522" font-size="13" font-weight="610">Claude accepts the browser-session premise.</text><text x="16" y="80" fill="#74716b" font-size="11">Agreement is visible, but does not erase prior disagreement.</text></g>
<g transform="translate(18 482)"><rect width="394" height="126" rx="18" fill="#1d1d1b"/><text x="18" y="29" fill="#aaa8a3" font-size="10" font-weight="730" letter-spacing="1">SYSTEM PRINCIPLE</text><text x="18" y="62" fill="#fff" font-size="17" font-weight="650">Accuracy over persuasion.</text><text x="18" y="88" fill="#fff" font-size="17" font-weight="650">Majority is information, not authority.</text><text x="18" y="111" fill="#aaa8a3" font-size="11">Models may revise, concede, or stay uncertain.</text></g></g>

<g transform="translate(1100 176)"><rect width="430" height="640" rx="26" fill="#fffdf9" stroke="#dedad2"/><rect x="18" y="18" width="394" height="78" rx="20" fill="#eadfd5"/><text x="38" y="51" fill="#62483a" font-size="16" font-weight="760">03 · CHANGED WITH RECEIPTS</text><text x="38" y="77" fill="#806453" font-size="13">谁改变了什么，又为什么？</text>
<text x="20" y="133" fill="#77736c" font-size="11" font-weight="730" letter-spacing="1">CONSULTATION THEATER</text>
<g transform="translate(18 154)"><rect width="394" height="150" rx="18" fill="#f1ede7"/><text x="18" y="30" fill="#765746" font-size="10" font-weight="760" letter-spacing="1">EXPLICIT REVISION · CLAUDE</text><rect x="18" y="50" width="136" height="34" rx="17" fill="#fffdf9"/><text x="86" y="72" fill="#625f59" text-anchor="middle" font-size="11">Web + Extension</text><text x="174" y="73" fill="#7c6ee6" font-size="21">→</text><rect x="208" y="50" width="166" height="34" rx="17" fill="#e8e5fa"/><text x="291" y="72" fill="#544aa6" text-anchor="middle" font-size="11" font-weight="700">Browser Extension</text><text x="18" y="112" fill="#74716b" font-size="11">causedBy: ChatGPT challenge + Gemini evidence</text><text x="18" y="132" fill="#74716b" font-size="11">click to inspect exact source events</text></g>
<g transform="translate(18 322)"><rect width="394" height="112" rx="17" fill="#f6f4ef"/><text x="16" y="28" fill="#77736c" font-size="10" font-weight="730">CONSULTATION OUTCOME</text><text x="16" y="58" fill="#22211f" font-size="18" font-weight="680">Browser Extension first</text><text x="16" y="82" fill="#74716b" font-size="11">Alignment 100% · different rationales preserved</text><text x="16" y="100" fill="#74716b" font-size="11">No chair model rewrites everyone’s final view.</text></g>
<g transform="translate(18 452)"><rect width="394" height="156" rx="18" fill="#f6f4ef"/><text x="16" y="28" fill="#77736c" font-size="10" font-weight="730">LOCAL REPLAY</text><text x="16" y="57" fill="#22211f" font-size="14" font-weight="650">▶ Round 2 · revision</text><rect x="16" y="76" width="362" height="3" rx="2" fill="#e2ded6"/><rect x="16" y="76" width="210" height="3" rx="2" fill="#7c6ee6"/><text x="16" y="108" fill="#74716b" font-size="11">Replays saved structured events.</text><text x="16" y="128" fill="#74716b" font-size="11">No Provider call. No invented explanation.</text></g></g>
</g></svg>