<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">ChatChat — AI consultation, not parallel answers</title>
  <desc id="desc">One proposal becomes independent opinions, equal consultation, explicit revisions and a traceable report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f4"/>
      <stop offset="1" stop-color="#f1ece4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202532"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="1600" height="720" rx="44" fill="url(#bg)"/>
  <circle cx="1430" cy="84" r="180" fill="#efe7ff" opacity=".7"/>
  <circle cx="134" cy="642" r="150" fill="#cff3da" opacity=".65"/>
  <g opacity=".28" fill="#8a837b">
    <circle cx="1120" cy="112" r="3"/><circle cx="1152" cy="112" r="3"/><circle cx="1184" cy="112" r="3"/><circle cx="1216" cy="112" r="3"/>
    <circle cx="1120" cy="144" r="3"/><circle cx="1152" cy="144" r="3"/><circle cx="1184" cy="144" r="3"/><circle cx="1216" cy="144" r="3"/>
  </g>

  <g transform="translate(84 76)">
    <g>
      <rect x="0" y="0" width="70" height="70" rx="22" fill="#151922"/>
      <text x="35" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter,ui-sans-serif,system-ui" font-size="28" font-weight="800">CC</text>
      <text x="94" y="50" fill="#151922" font-family="Inter,ui-sans-serif,system-ui" font-size="48" font-weight="800">ChatChat</text>
    </g>
    <text x="0" y="152" fill="#151922" font-family="Inter,ui-sans-serif,system-ui" font-size="70" font-weight="800">One proposal.</text>
    <text x="0" y="228" fill="#151922" font-family="Inter,ui-sans-serif,system-ui" font-size="70" font-weight="800">Independent minds.</text>
    <text x="0" y="304" fill="#8b5cf6" font-family="Inter,ui-sans-serif,system-ui" font-size="58" font-weight="800">A traceable consultation.</text>
    <text x="2" y="360" fill="#666a70" font-family="Inter,ui-sans-serif,system-ui" font-size="25">一个提案 · 独立思考 · 平等协商 · 可追溯改变</text>

    <g transform="translate(0 410)" font-family="Inter,ui-sans-serif,system-ui" font-size="17" font-weight="750">
      <rect x="0" y="0" width="120" height="43" rx="21" fill="#202532"/><text x="60" y="28" text-anchor="middle" fill="#fff">SEALED</text>
      <path d="M132 21 H168" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="184" y="0" width="132" height="43" rx="21" fill="#efe7ff"/><text x="250" y="28" text-anchor="middle" fill="#6741c7">CONSULT</text>
      <path d="M328 21 H364" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="380" y="0" width="122" height="43" rx="21" fill="#cff3da"/><text x="441" y="28" text-anchor="middle" fill="#267a4a">REVISE</text>
      <path d="M514 21 H550" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="566" y="0" width="118" height="43" rx="21" fill="#ffd8b8"/><text x="625" y="28" text-anchor="middle" fill="#8f4a16">REPORT</text>
    </g>
    <text x="2" y="518" fill="#757575" font-family="Inter,ui-sans-serif,system-ui" font-size="18">Browser-first · Local-first · Equal AI participants · English / 简体中文</text>
    <text x="2" y="567" fill="#333944" font-family="Inter,ui-sans-serif,system-ui" font-size="18" font-weight="650">Human-led · Built with assistance from OpenAI ChatGPT + Codex</text>
  </g>

  <g transform="translate(890 88)">
    <rect x="12" y="18" width="626" height="548" rx="38" fill="#1e2430" opacity=".14"/>
    <rect x="0" y="0" width="626" height="548" rx="38" fill="url(#panel)"/>
    <text x="42" y="55" fill="#a9adb7" font-family="Inter,ui-sans-serif,system-ui" font-size="17" font-weight="700" letter-spacing="2">SHARED BLACKBOARD</text>
    <text x="42" y="94" fill="#ffffff" font-family="Inter,ui-sans-serif,system-ui" font-size="28" font-weight="800">AIs can disagree — politely, visibly, usefully.</text>

    <g font-family="Inter,ui-sans-serif,system-ui">
      <g transform="translate(42 132)">
        <rect width="164" height="82" rx="20" fill="#ffffff"/><circle cx="34" cy="41" r="22" fill="#171b24"/><text x="34" y="47" fill="#fff" text-anchor="middle" font-size="16" font-weight="800">G</text><text x="67" y="36" fill="#151922" font-size="18" font-weight="800">ChatGPT</text><text x="67" y="59" fill="#6e706f" font-size="13">independent view</text>
      </g>
      <g transform="translate(230 132)">
        <rect width="164" height="82" rx="20" fill="#ffffff"/><circle cx="34" cy="41" r="22" fill="#171b24"/><text x="34" y="47" fill="#fff" text-anchor="middle" font-size="16" font-weight="800">C</text><text x="67" y="36" fill="#151922" font-size="18" font-weight="800">Claude</text><text x="67" y="59" fill="#6e706f" font-size="13">independent view</text>
      </g>
      <g transform="translate(418 132)">
        <rect width="164" height="82" rx="20" fill="#ffffff"/><circle cx="34" cy="41" r="22" fill="#171b24"/><text x="34" y="47" fill="#fff" text-anchor="middle" font-size="15" font-weight="800">Gm</text><text x="67" y="36" fill="#151922" font-size="18" font-weight="800">Gemini</text><text x="67" y="59" fill="#6e706f" font-size="13">independent view</text>
      </g>
    </g>

    <g transform="translate(42 244)" font-family="Inter,ui-sans-serif,system-ui">
      <rect width="540" height="74" rx="18" fill="#2d3341"/>
      <rect x="18" y="17" width="110" height="40" rx="20" fill="#efe7ff"/><text x="73" y="43" text-anchor="middle" fill="#6741c7" font-size="15" font-weight="800">CHALLENGE</text>
      <text x="150" y="33" fill="#ffffff" font-size="17" font-weight="750">What evidence supports this priority?</text>
      <text x="150" y="55" fill="#aeb2bd" font-size="13">exact target event id retained</text>
    </g>
    <g transform="translate(42 333)" font-family="Inter,ui-sans-serif,system-ui">
      <rect width="540" height="74" rx="18" fill="#2d3341"/>
      <rect x="18" y="17" width="104" height="40" rx="20" fill="#cff3da"/><text x="70" y="43" text-anchor="middle" fill="#267a4a" font-size="15" font-weight="800">EVIDENCE</text>
      <text x="145" y="33" fill="#ffffff" font-size="17" font-weight="750">The browser session is the differentiator.</text>
      <text x="145" y="55" fill="#aeb2bd" font-size="13">traceable source relationship</text>
    </g>
    <g transform="translate(42 427)" font-family="Inter,ui-sans-serif,system-ui">
      <rect width="540" height="78" rx="19" fill="#ffffff"/>
      <rect x="18" y="19" width="92" height="40" rx="20" fill="#ffd8b8"/><text x="64" y="45" text-anchor="middle" fill="#8f4a16" font-size="14" font-weight="800">REVISION</text>
      <text x="132" y="34" fill="#151922" font-size="15" font-weight="750">Claude</text>
      <text x="132" y="57" fill="#6e706f" font-size="15">Web + Extension</text>
      <path d="M278 51 H334" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="356" y="57" fill="#6741c7" font-size="15" font-weight="800">Browser Extension</text>
    </g>
  </g>
</svg>
