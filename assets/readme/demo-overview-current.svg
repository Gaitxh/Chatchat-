<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">ChatChat current consultation architecture</title>
  <desc id="desc">Proposal, sealed research, structural conflict threads, explicit stance fronts, final position floor, and execution integrity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f6f0"/><stop offset="1" stop-color="#eef3ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2d332f" flood-opacity=".08"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .eyebrow{font-size:15px;font-weight:800;letter-spacing:2.2px;fill:#788177}
      .title{font-size:31px;font-weight:800;fill:#222823}
      .body{font-size:17px;font-weight:540;fill:#5f675f}
      .small{font-size:14px;font-weight:600;fill:#737b74}
      .chip{font-size:13px;font-weight:760;fill:#4d5d51}
      .line{stroke:#b8c3b8;stroke-width:2.5;fill:none}
      .dash{stroke:#b8c3b8;stroke-width:2;stroke-dasharray:7 8;fill:none}
    </style>
  </defs>
  <rect width="1440" height="1080" fill="url(#bg)"/>
  <g class="sans">
    <text x="72" y="66" class="eyebrow">CHATCHAT · PROPOSAL IN → DECISION INTELLIGENCE OUT</text>
    <text x="72" y="110" class="title">A real consultation is more than “multiple answers”</text>
    <text x="72" y="142" class="body">Public event provenance, structural disputes, explicit stance movement, final-seat accounting, and Provider execution audit remain separate layers.</text>

    <!-- stage 1 -->
    <g filter="url(#shadow)"><rect x="72" y="188" width="260" height="226" rx="28" fill="#fffdf9" stroke="#dedbd3"/></g>
    <text x="96" y="222" class="eyebrow">01 · PROPOSAL + SEALED</text>
    <text x="96" y="262" class="title" font-size="27">Independent first</text>
    <text x="96" y="294" class="body">R1 cannot see peer answers.</text>
    <rect x="96" y="322" width="205" height="34" rx="17" fill="#edf4ee"/><text x="111" y="344" class="chip">LIVE RESEARCH DESK</text>
    <rect x="96" y="366" width="170" height="28" rx="14" fill="#f2eee6"/><text x="111" y="385" class="small">equal research lanes</text>

    <!-- stage 2 -->
    <g filter="url(#shadow)"><rect x="362" y="188" width="300" height="226" rx="28" fill="#fffdf9" stroke="#dedbd3"/></g>
    <text x="386" y="222" class="eyebrow">02 · PUBLIC BLACKBOARD</text>
    <text x="386" y="262" class="title" font-size="27">Debate with receipts</text>
    <text x="386" y="294" class="body">challenge · evidence · reply</text>
    <rect x="386" y="322" width="144" height="34" rx="17" fill="#eef1f7"/><text x="401" y="344" class="chip">PEER EXCHANGE</text>
    <rect x="538" y="322" width="101" height="34" rx="17" fill="#eef1f7"/><text x="552" y="344" class="chip">AGENDA</text>
    <text x="386" y="382" class="small mono">replyToEventId · targetEventId · causedBy</text>

    <!-- stage 3 -->
    <g filter="url(#shadow)"><rect x="692" y="188" width="328" height="226" rx="28" fill="#fffdf9" stroke="#dedbd3"/></g>
    <text x="716" y="222" class="eyebrow">03 · STRUCTURAL CONFLICT</text>
    <text x="716" y="262" class="title" font-size="27">What are they fighting over?</text>
    <rect x="716" y="302" width="142" height="34" rx="17" fill="#f6ece7"/><text x="731" y="324" class="chip">CONFLICT BOARD</text>
    <rect x="866" y="302" width="128" height="34" rx="17" fill="#f6ece7"/><text x="879" y="324" class="chip">RESOLUTION</text>
    <text x="716" y="366" class="small">OPEN debt stays open until exact provenance resolves it.</text>
    <text x="716" y="391" class="small">No embeddings. No summary AI inventing issues.</text>

    <!-- stage 4 -->
    <g filter="url(#shadow)"><rect x="1050" y="188" width="318" height="226" rx="28" fill="#fffdf9" stroke="#dedbd3"/></g>
    <text x="1074" y="222" class="eyebrow">04 · EXPLICIT STANCE FRONTS</text>
    <text x="1074" y="262" class="title" font-size="27">Who actually stood where?</text>
    <rect x="1074" y="302" width="104" height="34" rx="17" fill="#e7f1e8"/><text x="1090" y="324" class="chip">CURRENT</text>
    <rect x="1188" y="302" width="104" height="34" rx="17" fill="#f2e9e5"/><text x="1204" y="324" class="chip">VACATED</text>
    <text x="1074" y="366" class="small">Revision movement is explicit.</text>
    <text x="1074" y="391" class="small">Pressure ≠ inferred camp membership.</text>

    <!-- arrows -->
    <path d="M332 300 H350" class="line"/><path d="M662 300 H680" class="line"/><path d="M1020 300 H1038" class="line"/>

    <!-- middle separator -->
    <path d="M120 470 H1320" class="dash"/>
    <text x="72" y="505" class="eyebrow">MEETING CLOSE · TWO DIFFERENT QUESTIONS</text>

    <!-- final floor -->
    <g filter="url(#shadow)"><rect x="72" y="540" width="760" height="358" rx="30" fill="#fffdf9" stroke="#d9ddd7"/></g>
    <text x="100" y="578" class="eyebrow">FINAL POSITION FLOOR · MEETING-WIDE</text>
    <text x="100" y="620" class="title">What was recorded for every final seat?</text>
    <text x="100" y="650" class="body">Report accounting stays separate from thread-local fronts.</text>

    <rect x="100" y="682" width="440" height="92" rx="18" fill="#edf5ee" stroke="#d6e3d7"/>
    <text x="122" y="712" class="eyebrow">REPORT LEADING GROUP · DESCRIPTIVE</text>
    <text x="122" y="747" class="title" font-size="25">Web + Extension · 5/6 · 83%</text>

    <rect x="558" y="682" width="246" height="92" rx="18" fill="#f5eee8" stroke="#e5d7ce"/>
    <text x="580" y="712" class="eyebrow">MINORITY SURVIVES</text>
    <text x="580" y="747" class="title" font-size="23">Browser Extension · 1</text>

    <rect x="100" y="796" width="202" height="58" rx="14" fill="#eef4f8"/><text x="118" y="821" class="chip">✓ provider_final</text><text x="118" y="842" class="small">verified / repaired</text>
    <rect x="314" y="796" width="224" height="58" rx="14" fill="#fff0ea"/><text x="332" y="821" class="chip">≈ fallback_placeholder</text><text x="332" y="842" class="small">not model-authored Final</text>
    <rect x="550" y="796" width="254" height="58" rx="14" fill="#f2f0ec"/><text x="568" y="821" class="chip">? unverified_record</text><text x="568" y="842" class="small">execution provenance missing</text>

    <text x="100" y="882" class="small mono">explicit revision receipt ≠ later Final shift without revision receipt</text>

    <!-- integrity -->
    <g filter="url(#shadow)"><rect x="862" y="540" width="506" height="358" rx="30" fill="#223029" stroke="#314139"/></g>
    <text x="890" y="578" class="eyebrow" fill="#9fb8a7">MEETING EXECUTION INTEGRITY</text>
    <text x="890" y="622" font-size="32" font-weight="800" fill="#f4f8f5">Did the Providers really complete?</text>
    <text x="890" y="657" font-size="17" font-weight="540" fill="#c4d0c8">Alignment and execution coverage are different facts.</text>
    <rect x="890" y="692" width="202" height="92" rx="18" fill="#2f4438"/>
    <text x="912" y="724" font-size="15" font-weight="750" fill="#a9c5b1">STANCE ALIGNMENT</text>
    <text x="912" y="762" font-size="32" font-weight="850" fill="#fff">83%</text>
    <rect x="1108" y="692" width="232" height="92" rx="18" fill="#2f4438"/>
    <text x="1130" y="724" font-size="15" font-weight="750" fill="#a9c5b1">VERIFIED TURNS</text>
    <text x="1130" y="762" font-size="32" font-weight="850" fill="#fff">12 / 12</text>
    <text x="890" y="818" font-size="16" font-weight="620" fill="#d6dfd9">Neither number is an answer-correctness score.</text>
    <text x="890" y="850" font-size="14" font-weight="560" fill="#9fb0a5">Durable execution receipt · local replay · zero Provider calls</text>

    <!-- proof rail -->
    <g filter="url(#shadow)"><rect x="72" y="938" width="1296" height="96" rx="24" fill="#fffdf9" stroke="#dedbd3"/></g>
    <text x="98" y="969" class="eyebrow">REAL PRODUCT PROOF</text>
    <text x="98" y="1004" class="body">Same-session CDP ready marker → two paint frames → PNG + DOM → nonblank pixel validation → semantic validator</text>
    <rect x="1120" y="964" width="220" height="42" rx="21" fill="#f6ebe3"/><text x="1143" y="991" class="chip">DEMO · SYNTHETIC ≠ LIVE AI</text>
  </g>
</svg>