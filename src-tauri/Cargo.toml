[package]
name = "chatchat"
version = "0.9.0"
description = "ChatChat local-first AI Council desktop shell"
authors = ["ChatChat contributors"]
edition = "2021"
[lib]
name = "chatchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
